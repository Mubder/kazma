# Single-owner Kazma + Postgres + local persistent state
#
#   docker compose -f docker-compose.ha.yml up -d --build
#
# Postgres holds checkpoints / settings / chat sessions / swarm tasks /
# document jobs. Memory, cron, vault, workspaces, approvals and turn delivery
# still use local state. An OS writer lock refuses a second server using
# this data directory. WAL contention is not an ownership protocol.
# Do not scale Kazma or share these volumes across hosts/NFS. The owner can
# restart on this host after lock release; this is not qualified cross-host HA.
# See docs/DURABLE_SETTINGS_AND_LIVE_EVAL.md for deployment and recovery gates.
#
# External load balancer should:
#   - health check GET /health/ready (expect 200)
#   - liveness GET /health/live
#   - WebSocket Upgrade for `/ws/*` (see deploy/nginx-ha.conf)
#
# Required in .env: KAZMA_SECRET, KAZMA_VAULT_KEY, POSTGRES_PASSWORD
services:
  db:
    # Pinned by version and digest (tests/test_container_services.py);
    # Dependabot's docker-compose updates propose new ones.
    image: postgres:16.16-alpine@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    container_name: kazma-db
    environment:
      POSTGRES_USER: kazma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kazma
    volumes:
      - kazma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazma -d kazma"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kazma:
    build: .
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
    environment:
      KAZMA_HOST: "0.0.0.0"
      KAZMA_TRUST_LAN: "0"
      KAZMA_PRODUCTION: "1"
      KAZMA_HOST_SHELL: "0"
      KAZMA_DATA_DIR: "/app/kazma-data"
      KAZMA_CODE_EXEC_DOCKER: "${KAZMA_CODE_EXEC_DOCKER:-force}"
      KAZMA_VECTOR_PATH: "/home/kazma/.kazma/vector_memory"
      KAZMA_DATABASE_URL: "postgresql://kazma:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/kazma"
      KAZMA_DB_BACKEND: "postgres"
      KAZMA_SECRET: ${KAZMA_SECRET:?set KAZMA_SECRET}
      KAZMA_VAULT_KEY: ${KAZMA_VAULT_KEY:?set KAZMA_VAULT_KEY}
      KAZMA_PUBLIC_URL: ${KAZMA_PUBLIC_URL:-}
      KAZMA_OIDC_ISSUER: ${KAZMA_OIDC_ISSUER:-}
      KAZMA_OIDC_CLIENT_ID: ${KAZMA_OIDC_CLIENT_ID:-}
      KAZMA_OIDC_CLIENT_SECRET: ${KAZMA_OIDC_CLIENT_SECRET:-}
    volumes:
      # All local state belongs to the one runtime owner.
      - kazma_vectors:/home/kazma/.kazma/vector_memory
      - kazma_data:/app/kazma-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    # The stable line (1.27 no longer gets fixes), pinned by version and digest.
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: kazma-nginx
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${HOST_PORT:-9090}:80"
    volumes:
      - ./deploy/nginx-ha.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kazma
    restart: unless-stopped

volumes:
  kazma_pgdata:
  kazma_vectors:
  kazma_data:
