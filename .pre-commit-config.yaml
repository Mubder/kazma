# Pre-commit hooks (opt-in): pip install pre-commit && pre-commit install
#
# import-gates: the crawl.py incident class (2026-08-14) — a module deletion
# left a dangling import that py_compile (syntax-only) and the behavioral
# suite both missed; it broke research in production at first use. These
# two tests import every product module and AST-verify every kazma_*
# import reference resolves. ~5s. See tests/test_imports.py.
repos:
  - repo: local
    hooks:
      - id: kazma-import-gates
        name: kazma import gates (every module imports + no dangling refs)
        entry: .venv/Scripts/python.exe -m pytest tests/test_imports.py -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      # static-gates: the 2026-08-29 audit class — defects found by grepping
      # the tree, not by a failing test. Blocking sqlite on the event loop
      # (F-06), fire-and-forget tasks the GC can cancel (F-07), tools missing
      # a HITL tier (F-04), and unfenced web content (F-09). AST-only, ~3s.
      - id: kazma-static-gates
        name: kazma static gates (async/blocking, task retention, HITL tiers, fencing)
        entry: .venv/Scripts/python.exe -m pytest tests/test_static_gates.py -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
