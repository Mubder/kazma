version: 2
updates:
  # Python dependencies: pyproject.toml and the uv.lock that pins them.
  # "uv", not "pip" (2026-10-02): the pip ecosystem never touched uv.lock,
  # and against pyproject's ">=" minimums it had nothing to raise, so it
  # opened no Python update at all while the lock aged with known advisories.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Kazma pins versions carefully (LLM providers, psycopg, langgraph) —
    # group minor/patch updates so a PR is reviewable as one unit, and let
    # humans decide on majors.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflow versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
