version: 2
updates:
  # Python dependencies: pyproject.toml and the uv.lock that pins them.
  # "uv", not "pip" (2026-10-02): the pip ecosystem never touched uv.lock,
  # and against pyproject's ">=" minimums it had nothing to raise, so it
  # opened no Python update at all while the lock aged with known advisories.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Kazma pins versions carefully (LLM providers, psycopg, langgraph) —
    # group minor/patch updates so a PR is reviewable as one unit, and let
    # humans decide on majors.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # PyMuPDF 2's table finder runs an ONNX layout model (pymupdf-layout)
      # that crashes natively inside page.find_tables(): Kazma's PDF parser
      # worker died with SIGSEGV on 2.1 (CI, 2026-11-09) and again on Windows
      # (2026-11-13). pyproject holds it below 2; try a new 2.x by hand.
      - dependency-name: "pymupdf"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflow versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"

  # Container base images (2026-11, supply chain): every Dockerfile pins its
  # FROM by digest (tests/test_setup_downloads_verified.py), so a new image
  # reaches Kazma only as a reviewed pull request, never by a tag moving.
  # Dependabot reads every Dockerfile* in each folder (Dockerfile.demo too).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy/document-worker"
      - "/deploy/document-broker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Python 3.15 has no onnxruntime build (the OCR engines, Chroma's
      # embedding stack) and Chroma does not resolve on it (2026-11-13): the
      # images stay on the newest Python every package has wheels for.
      - dependency-name: "python"
        versions: [">= 3.15"]

  # The images Kazma's compose files run (2026-11-13): SearXNG and Neo4j are
  # pinned by version and digest (tests/test_container_services.py), so a new
  # one reaches an install only as a reviewed pull request.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/deploy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # An odd nginx minor is its development ("mainline") line; Kazma's HA
      # proxy runs the stable one (even minor).
      - dependency-name: "nginx"
        versions: ["1.31.x", "1.33.x", "1.35.x"]
