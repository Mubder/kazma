# Put the framework's metrics on the kazma.ai website, once a day.
#
# Generates METRICS.md and metrics.json at the head of main, then
# scripts/sync_site_metrics.py makes ONE open pull request on the private
# website repo (Mubder/KazmaAI) carry them, and fails unless it does. Merging
# that pull request deploys the site (Cloudflare Pages); nothing here merges,
# and nothing here writes to this repository (contents: read -- main is
# protected, and GitHub will not let the Actions app bypass a ruleset on a
# personal-account repository; docs/docs/ops/branch-protection.md section 3).
#
# Daily, not per push: every update of the website branch builds a Cloudflare
# Pages preview, and 529 framework pushes in September 2026 meant 529 preview
# builds -- more than the Pages free plan's 500 a month -- for numbers the site
# only needs daily. For an immediate refresh: Actions > Sync Metrics > Run
# workflow.
#
# Until 2026-09-27 this ran on every push and was green while the site got
# nothing: it looked the pull request up with `gh pr view <branch>`, which
# returns a MERGED one, and "updated" PR #3 (merged 2026-07-30) for two
# months. It also installed nothing, so pytest could not collect and every
# copy said "Collected at runtime: n/a". The job now installs what CI's Tests
# job installs (tests/test_site_metrics_sync.py holds the two lines equal),
# --require-collected fails a run without the count, and the sync script
# reads the pull request back.
#
# Requires the WEBSITE_TOKEN secret: a fine-grained PAT for Mubder/KazmaAI with
# Contents and Pull requests read & write. Without it the run fails.
# Details and the metrics.json layout: docs/docs/ops/website-metrics.md.

name: Sync Metrics

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  workflow_dispatch: # Actions > Sync Metrics > Run workflow

permissions:
  contents: read

# One sync at a time; a queued run waits rather than cancelling one mid-push.
concurrency:
  group: sync-metrics
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate & open site PR
    if: github.repository == 'Mubder/kazma'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout framework repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit count needs the whole history

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install deps
        # The same set as CI's Tests job, so `pytest --collect-only` counts
        # the tests CI runs.
        run: pip install -e ".[test]" pillow pymupdf sqlite-vec pypdfium2 numpy prometheus-client

      - name: Generate the metrics
        env:
          GH_TOKEN: ${{ github.token }} # the contributors API, rate limit only
        run: python scripts/generate_metrics.py --out-dir "$RUNNER_TEMP/site-metrics" --require-collected

      - name: Keep the generated files
        uses: actions/upload-artifact@v4
        with:
          name: site-metrics
          path: ${{ runner.temp }}/site-metrics
          retention-days: 14

      - name: Open or refresh the website pull request
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WEBSITE_TOKEN is not set, so the website cannot get its metrics (see this workflow's header)."
            exit 1
          fi
          # git push/fetch authenticate through gh with the same token.
          gh auth setup-git
          python scripts/sync_site_metrics.py --source "$RUNNER_TEMP/site-metrics"
