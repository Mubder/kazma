# Auto-sync repository metrics to the kazma.ai website.
#
# When the framework changes (push to main), regenerate METRICS.md, commit it
# back to the framework's main branch (keeps the source of truth honest), then
# open (or update) a PR against the PRIVATE website repo (Mubder/KazmaAI) so the
# public metrics card on kazma.ai stays fresh. Merging that auto-PR triggers
# Cloudflare Pages' production deploy.
#
# The workflow triggers itself recursively: the bot's METRICS.md commit to main
# re-runs the workflow, but that second run finds nothing changed and exits — so
# it converges (no infinite loop).
#
# Requires the `WEBSITE_TOKEN` repository secret: a fine-grained PAT scoped to
# Mubder/KazmaAI with Contents + Pull requests (read & write). Without it the
# website-sync step is skipped gracefully (the framework commit still happens
# via GITHUB_TOKEN). See workflow header for setup.
#
# Manual fallback: scripts/refresh-and-deploy-metrics.sh (one command, locally).

name: Sync Metrics

on:
  push:
    branches: [main]
    paths-ignore:
      - 'METRICS.md' # the bot's own metrics commit shouldn't loop us
  workflow_dispatch: # manual trigger from the Actions tab

# The framework commit step needs write access to contents.
permissions:
  contents: write
  pull-requests: read

# Serialize Sync Metrics runs. Queue (don't cancel): cancelling in-flight runs
# lost important refreshes — when the runner queue was slow and another push
# landed, cancel-in-progress killed a run that was carrying a real metrics fix,
# so it never reached the website PR. Queuing guarantees every push eventually
# refreshes; the latest run wins because each overwrites the same PR branch.
concurrency:
  group: sync-metrics
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  WEBSITE_REPO: "Mubder/KazmaAI"
  PR_BRANCH: "chore/auto-refresh-metrics"
  PR_TITLE: "chore(metrics): auto-refresh METRICS.md from framework"
  TARGET_PATH: "src/data/METRICS.md"

jobs:
  sync:
    name: Regenerate, commit & open site PR
    runs-on: ubuntu-latest
    # Skip the workflow's own bot commits (belt-and-suspenders with paths-ignore).
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout framework repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — generate_metrics.py needs git ls-files + rev-parse
          token: ${{ secrets.GITHUB_TOKEN }} # write back to framework main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Regenerate METRICS.md
        id: regen
        run: |
          python scripts/generate_metrics.py --write
          if git diff --quiet METRICS.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "METRICS.md unchanged — nothing to commit or sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat METRICS.md
          fi

      - name: Nothing to do
        if: steps.regen.outputs.changed != 'true'
        run: echo "Metrics current — exiting."

      # 1) Keep the framework's own METRICS.md honest: commit directly to main.
      #    This is a generated artifact, so a direct bot commit is appropriate
      #    (no PR review needed). Uses GITHUB_TOKEN, available with no secret.
      - name: Commit refreshed METRICS.md to framework main
        if: steps.regen.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add METRICS.md
          git commit -m "chore(metrics): auto-regenerate METRICS.md [skip ci]"
          git push

      # 2) Sync the same file to the private website repo via PR.
      - name: Detect WEBSITE_TOKEN presence
        id: token
        env:
          WEBSITE_TOKEN_REF: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          if [ -n "$WEBSITE_TOKEN_REF" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; \
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "WEBSITE_TOKEN not set — skipping site sync (see workflow header)."; fi

      - name: Sync refreshed METRICS.md to website repo
        if: steps.regen.outputs.changed == 'true' && steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          set -euo pipefail
          echo "→ Cloning website repo ($WEBSITE_REPO) with the sync token…"
          gh repo clone "$WEBSITE_REPO" site -- --depth 1

          cd site
          # Authenticate raw git operations (push/fetch) for this clone with the
          # WEBSITE_TOKEN. gh repo clone authenticates the clone itself, but the
          # credential helper it installs does not cover subsequent `git push` —
          # without this, push fails with "could not read Username for github.com".
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH" origin/main

          cp "../METRICS.md" "$TARGET_PATH"
          if git diff --quiet; then echo "Website copy already in sync — no PR needed."; exit 0; fi

          git add "$TARGET_PATH"
          SHORT_HEAD=$(git -C .. rev-parse --short HEAD)
          FW_MSG=$(git -C .. log -1 --pretty=%s)
          git commit -m "chore(metrics): auto-refresh from framework @ ${SHORT_HEAD}

          ${FW_MSG}

          Auto-generated by the Sync Metrics workflow in Mubder/kazma."
          # The PR branch is auto-managed (it exists solely to carry this one
          # file refresh), so overwriting it is intentional. Plain --force is
          # used instead of --force-with-lease because the shallow clone above
          # (--depth 1) doesn't reliably carry a current ref for the existing
          # remote branch, which made force-with-lease fail with "stale info"
          # when a prior run already created the branch.
          git push --force origin "$PR_BRANCH"

          PR_BODY="Auto-refreshed METRICS.md from the framework repo (\`Mubder/kazma\`) at commit \`${SHORT_HEAD}\`.

          Source commit: ${FW_MSG}

          Merging triggers the Cloudflare Pages production deploy to kazma.ai.
          _This PR was opened automatically by the **Sync Metrics** workflow._"

          if gh pr view "$PR_BRANCH" --json url >/dev/null 2>&1; then
            echo "Updated existing PR: $(gh pr view "$PR_BRANCH" --json url --jq .url)"
          else
            gh pr create --base main --head "$PR_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
            echo "Opened new PR against $WEBSITE_REPO."
          fi
