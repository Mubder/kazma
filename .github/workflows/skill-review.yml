name: Skill Review

on:
  pull_request:
    paths:
      - 'kazma-skills/**'
      - 'kazma-core/kazma_core/hub/**'
      - 'kazma-core/kazma_core/agent_skills/**'
      - 'skills/**'
      - '.github/workflows/skill-review.yml'

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Kazma
        run: pip install -e ".[test]"
      - name: Validate skills and a negative fixture
        run: |
          python -c "
          import asyncio, sys
          from pathlib import Path
          from kazma_core.hub.validator import SkillValidator

          async def main():
              v = SkillValidator()
              bad = Path('kazma-skills') / '_negative_fixture_absent'
              result = await v.validate(bad)
              if result.passed:
                  print('negative control failed: missing manifest was accepted')
                  return 1
              roots = [
                  Path('kazma-skills/kazma_skills/native'),
                  Path('skills'),
              ]
              found = 0
              for root in roots:
                  if not root.is_dir():
                      continue
                  for skill in sorted(p for p in root.iterdir() if p.is_dir()):
                      if not (skill / 'skill_manifest.yaml').is_file():
                          continue
                      found += 1
                      checked = await v.validate(skill)
                      if not checked.passed:
                          print(f'FAIL {skill}: {checked.errors}')
                          return 1
                      print(f'OK {skill}')
              if found == 0:
                  print('No skill_manifest.yaml files found')
                  return 1
              print(f'Validated {found} skills; negative fixture rejected')
              return 0

          sys.exit(asyncio.run(main()))
          "

  test-skill:
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install pytest pytest-cov
      - name: Run Skill Tests
        run: >-
          python -m pytest tests/test_agent_skills.py tests/test_agent_skill_integrity.py
          tests/test_skill_validation.py tests/test_skill_checksum.py
          tests/test_hub_validator.py tests/test_mcp_ide_alias_auth.py
          tests/test_database_read_capabilities.py -q --tb=short
          --cov=kazma_skills --cov-report=xml

  security-scan:
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[test]"
      - name: Check Dependency Vulnerabilities
        run: |
          python - <<'PY'
          import asyncio, sys
          from kazma_core.security.dependency_scanner import audit_installed
          report = asyncio.run(audit_installed())
          for item in report.open_vulnerabilities:
              print(f'{item.package} {item.version}: {item.vuln_id}')
          print(f'Queried {report.total} installed distributions; '
                f'{len(report.open_vulnerabilities)} unreviewed advisories')
          sys.exit(bool(report.open_vulnerabilities))
          PY
      - name: Verify No Hardcoded Secrets
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from kazma_core.security.secret_scan import find_credentials
          found = []
          scanned = 0
          roots = [Path('kazma-skills/kazma_skills/native'), Path('skills')]
          for root in roots:
              if not root.is_dir():
                  continue
              for f in root.rglob('*'):
                  if f.is_file() and f.suffix in ('.py', '.yaml', '.yml', '.json', '.env'):
                      scanned += 1
                      for finding in find_credentials(
                          f.read_text(encoding='utf-8'), bare_values=f.suffix != '.py'
                      ):
                          found.append(f'{f}:{finding.line}: {finding.kind}')
          if scanned == 0:
              print('No skill source/config files found — refusing an empty scan')
              sys.exit(1)
          if found:
              print('POTENTIAL SECRETS FOUND:')
              for s in found:
                  print(f'  {s}')
              sys.exit(1)
          print('No hardcoded secrets detected')
          sys.exit(0)
          PY
