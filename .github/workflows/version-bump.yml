# Light auto versioning on main (see docs/VERSIONING.md).
#
# * ONLY patch digit moves: 0.12.0 → 0.12.1 → 0.12.2
# * Version string embeds commit id: 0.12.1+g92c55af (PEP 440 local)
# * Middle digit ("12") NEVER changes here — only manual Release + CONFIRM
name: Auto Bump Version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Do not re-enter on the release commit itself
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Light patch bump + commit id
        run: |
          set -euo pipefail
          python scripts/light_version_bump.py \
            --level patch \
            --skip-if-tagged \
            --write \
            --commit \
            --tag

      - name: Push commit and tags
        run: |
          set -euo pipefail
          # May be a no-op if skip-if-tagged
          git push origin HEAD:main --follow-tags
