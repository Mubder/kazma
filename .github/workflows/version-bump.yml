# DISABLED — product version is no longer auto-bumped on push.
#
# Practice (docs/VERSIONING.md):
#   * Public base stays fixed in pyproject.toml (e.g. 0.9.4)
#   * Runtime always shows 0.9.4+gSHORTSHA via kazma_core.version
#   * Digits change only by deliberate hand edit of the base
#
# This workflow file is kept as a no-op stub so old branch protection /
# badge links do not 404. Safe to delete once nothing references it.
name: Auto Bump Version (disabled)

on:
  workflow_dispatch:
    # Manual only — intentionally no push-to-main trigger.
    inputs:
      reason:
        description: "This workflow is disabled. Do not use."
        required: false
        default: "disabled"

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain and exit
        run: |
          echo "::notice::Auto version bump is disabled."
          echo "Display version = base from pyproject + live git short SHA"
          echo "See docs/VERSIONING.md and kazma_core.version.get_version()"
          exit 0
