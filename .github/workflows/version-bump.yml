# Light 0.x bumps on every push to main (see docs/VERSIONING.md).
# feat/fix → PATCH (0.12.0 → 0.12.1). Not MINOR (no more 0.10 → 0.11 → 0.12).
name: Auto Bump Version

on:
  push:
    branches:
      - main  # Runs every time code is merged into main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed so GitHub can push the tag/version back to repo
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Downloads full history so Commitizen can read past tags
          fetch-tags: true  # Ensures git tags are downloaded
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Commitizen Bump (light patch policy)
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          # Config lives in pyproject.toml [tool.commitizen] / [tool.commitizen.customize]
          # feat → PATCH, breaking → MINOR under major_version_zero