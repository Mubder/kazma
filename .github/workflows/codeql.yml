# CodeQL code scanning, as a workflow in the repository (2026-11-16).
#
# It replaces GitHub's "default setup" for code scanning, which ran the same
# analysis from the repository's settings where nobody reading the repository
# could see it -- OpenSSF Scorecard's SAST check among them. The categories
# are default setup's (/language:<name>), so its alerts and their dismissals
# carry over. Every push to main, and weekly.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, csharp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
