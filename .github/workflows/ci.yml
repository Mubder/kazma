name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install core deps
        run: pip install -e .
      - name: Compile all Python files
        run: |
          python -c "
          import py_compile, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              if '.venv' in str(f) or 'node_modules' in str(f):
                  continue
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              for e in errors: print(e)
              exit(1)
          print(f'All Python files compiled OK')
          "

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Run Ruff (syntax/undefined names — GATE)
        run: ruff check kazma-core/kazma_core/ kazma-gateway/kazma_gateway/ kazma-ui/kazma_ui/ --select E9,F63,F7,F82
      - name: Run Ruff (full — advisory)
        run: ruff check kazma-core/kazma_core/ kazma-gateway/kazma_gateway/ kazma-ui/kazma_ui/ --exit-zero

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        # Extra light pure-wheel deps (deep-audit 2026-08-19, finding #20)
        # un-skip the PIL / pymupdf / sqlite-vec / pypdfium2 test suites that
        # otherwise `importorskip` silently on the merge gate. numpy un-degrades
        # the PPR power iteration (without it compute_local_ppr returns uniform
        # seed weights and the memory-graph tests fail on the degraded path).
        # Playwright smoke is a *separate* job (boot-wait polls /health/live).
        # torch-bearing extras (rag) are too heavy for CI.
        # prometheus-client added 2026-09-16: tests/test_context_integrity.py
        # imports it unguarded to assert the trim counters actually move, so
        # without it that test ERRORED rather than skipped. It is a tiny pure
        # wheel and installing it exercises the metrics path instead of
        # hiding it — the same reasoning as the extras above.
        run: pip install -e ".[test]" pillow pymupdf sqlite-vec pypdfium2 numpy prometheus-client
      - name: Install Arabic rendering system deps
        # The visual RTL tests (tests/test_docx_rtl_visual.py) render DOCX
        # through LibreOffice and measure where glyphs land on the page. They
        # are the only Arabic tests that cannot lie — and they skipped on every
        # CI run, because soffice and the Arabic fonts were never installed. The
        # w:jc-inversion class of bug was free to come back green.
        # `fonts-noto-naskh-arabic` is NOT a package on Ubuntu noble (or on
        # Debian). apt exits 100 on an unknown name, which failed this step —
        # and with it the ENTIRE Tests job — on every run since it was added
        # in 30398512. Six consecutive red runs on main, and the gate that
        # was supposed to be catching regressions had not executed once
        # (audit 2026-09-16 follow-up). The Naskh faces ship inside
        # `fonts-noto-core`; verify that rather than trust the name, so a
        # future rename fails loudly here instead of silently re-skipping the
        # Arabic visual tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer fonts-noto-core fontconfig \
            tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          if ! fc-list | grep -qi "naskh"; then
            echo "::error::Noto Naskh Arabic is missing — tests/test_docx_rtl_visual.py would skip silently."
            fc-list | grep -i noto | head -20
            exit 1
          fi
          echo "Noto Naskh Arabic present:"
          fc-list | grep -i naskh | head -3
      - name: Run tests (GATE — failures fail CI)
        # Industry eval pack (tests/test_eval_pack.py, marker `eval`) is in
        # tests/ and is collected by fast_test.py — do not exclude it.
        # Crash-tolerant chunked runner (scripts/fast_test.py): the bare
        # monolithic pytest run takes 20+ min and intermittently segfaults
        # (native lib), killing the run with no results. The chunked runner
        # executes file-chunks as independent serial pytest processes,
        # retries crashed chunks per-file, and still gates on every failure.
        run: python scripts/fast_test.py --chunks 4 --chunk-timeout 1500
        env:
          KAZMA_DB_BACKEND: sqlite
      - name: Metrics check (advisory)
        # NOT a gate, and deliberately so: METRICS.md is regenerated by the
        # sync-metrics bot AFTER a push, so any commit that changes LOC is
        # legitimately "stale" until the bot lands. Gating here would fail
        # every real PR. The race-free half of this check is the README gate
        # below.
        run: python scripts/generate_metrics.py --check || true
      - name: README metrics gate
        # README carries "Metrics auto-verified from METRICS.md" above a
        # table nothing verified — on 2026-09-16 it advertised 7,346 tests /
        # ~409K LOC against a real 7,659 / 430K (audit F-7). This compares
        # README against the repository itself, so it does not depend on the
        # bot having committed, and it GATES.
        run: python scripts/generate_metrics.py --check-readme

  postgres:
    name: Tests (Postgres backend)
    runs-on: ubuntu-latest
    # Every other job pins KAZMA_DB_BACKEND=sqlite, so until this job existed
    # the entire Postgres tier ran in NO ci job at all: repository_pg.py
    # (1,355 LOC), jobs_pg.py (1,060), pg_backup.py, the ConfigStore Postgres
    # branch and langgraph-checkpoint-postgres — all shipped in
    # docker-compose.postgres.yml / .ha.yml as the supported multi-replica
    # mode, all untested (audit 2026-09-16 F-7).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kazma
          POSTGRES_PASSWORD: kazma
          POSTGRES_DB: kazma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kazma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -e ".[test,postgres]"
      - name: Run the Postgres-specific suites against a real Postgres
        # Named files rather than a broad `-k`: a keyword sweep drags in
        # SQLite-shaped tests that fail for reasons that are not the backend,
        # and a job that is red on day one gets ignored, which is how we got
        # here. This is a tripwire for the pg code paths, NOT parity with the
        # SQLite suite — docs/KNOWN_GAPS.md says so explicitly.
        run: |
          python -m pytest -q --timeout=300 \
            tests/test_pg_backup.py \
            tests/test_pg_store_dual_backend.py \
            tests/test_pg_dump_reported_not_assumed.py \
            tests/test_pg_bridge_docker_env.py \
            tests/test_document_jobs_pg_idempotency.py \
            tests/test_document_repository_pg_quota.py \
            tests/test_memory_pgvector.py
        env:
          KAZMA_DB_BACKEND: postgres
          KAZMA_DATABASE_URL: postgresql://kazma:kazma@localhost:5432/kazma_test
          # Without this the root conftest.py force-pins sqlite and strips the
          # DSN, and this job would silently prove nothing (audit F-7).
          KAZMA_TEST_ALLOW_REAL_DB: "1"

  unified-turn-lifecycle:
    name: Unified turn lifecycle (GATE)
    runs-on: ubuntu-latest
    # docs/plans/UNIFIED_TURN_BLOCK.md section 13. The suite this job runs is
    # the one thing that proves sequential approval end to end: the real
    # graph pauses four times and each resume comes from POST /api/approve.
    # scripts/fast_test.py excludes tests/e2e, so without a job of its own
    # the harness would run nowhere -- which is how tests/e2e/test_hitl_view_model.py
    # came to leave incidents 1 and 4 unclaimed for a month.
    #
    # It does NOT need Playwright: it drives the HTTP routes. Keeping it out
    # of the browser job means a missing Chromium cannot hide a lifecycle
    # regression behind a skip.
    #
    # Phase 5 still owns making this job REQUIRED in branch protection. A
    # workflow file is not merge enforcement (section 13, last bullet).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The projector is one contract in two languages; this job runs both
      # halves against the same fixtures, so it needs node as well.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install app
        run: pip install -e ".[test,web]"
      - name: Four sequential gates through the real app graph
        run: python -m pytest tests/e2e/test_unified_turn_app_graph.py -q --timeout=600
        env:
          KAZMA_DB_BACKEND: sqlite
      - name: Shared Python/JavaScript turn fixtures
        run: python -m pytest tests/test_unified_turn_fixtures.py -q --timeout=120
        env:
          KAZMA_DB_BACKEND: sqlite
      - name: Turn identity, revision and durable presentation
        run: |
          python -m pytest -q --timeout=240 tests/test_turn_document.py tests/test_turn_durable_presentation.py tests/test_chat_as_product.py tests/test_chat_steer_composer.py tests/test_delivery_v2_client.py
        env:
          KAZMA_DB_BACKEND: sqlite
      - name: Projector agreement under bare node
        run: |
          node tests/js/test_turn_document.js
          node tests/js/test_turn_view.js
          node tests/js/test_turn_preferences.js
          node tests/js/test_turn_presentation.js
          node tests/js/test_unified_turn_fixtures.js
      - name: Unified turn block reproductions (xfail-strict)
        # Red on purpose until Phases 2 and 3 land. strict=True means an
        # unexpected pass FAILS, so a behavior cannot ship without the
        # marker coming off with it.
        run: python -m pytest tests/test_unified_turn_block_phase0.py -q --timeout=120
        env:
          KAZMA_DB_BACKEND: sqlite

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install app + Playwright
        run: |
          pip install -e ".[test,web]"
          python -m playwright install chromium --with-deps
      - name: Health + composer smoke
        run: python -m pytest tests/e2e/test_smoke.py -q --timeout=180
        env:
          KAZMA_DB_BACKEND: sqlite
      - name: HITL view-model (incidents 2 and 3 — GATE)
        # HITL_VIEW_MODEL F. fast_test.py excludes tests/e2e. This step is
        # the merge gate for refresh-mid-pause and refresh-after-settle.
        # Incidents 1 and 4 stay unclaimed (F0: create_app() supervisor
        # does not pause). No || true. importorskip only when Playwright
        # is absent, same as smoke.
        run: python -m pytest tests/e2e/test_hitl_view_model.py -q --timeout=180
        env:
          KAZMA_DB_BACKEND: sqlite
      - name: Remaining e2e suites
        # scripts/fast_test.py excludes everything under tests/e2e, and this
        # job only ever ran test_smoke.py — so test_delivery_v2_e2e.py,
        # test_e2e_playwright.py and test_memory_playwright.py ran in NO job
        # at all (audit 2026-09-16 F-7). Same orphaning the pyproject comment
        # already records for kazma-core/tests.
        run: |
          python -m pytest -q --timeout=300 \
            tests/e2e/test_delivery_v2_e2e.py \
            tests/e2e/test_e2e_playwright.py \
            tests/e2e/test_memory_playwright.py
        env:
          KAZMA_DB_BACKEND: sqlite

  windows-selector-loop:
    name: Windows selector-loop subset
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test deps
        run: pip install -e ".[test]"
      - name: Compile-check + selector-loop regressions
        run: |
          python -c "import py_compile, pathlib; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('kazma-core/kazma_core').rglob('*.py')]"
          python -m pytest tests/test_audit_2026_08_31_strengthen.py tests/test_audit_deep_structure_fixes.py -q --timeout=120
        env:
          KAZMA_DB_BACKEND: sqlite

  js-check:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check all static JS
        run: |
          failures=0
          for f in $(find kazma-ui/kazma_ui/static/js -name '*.js'); do
            if ! node --check "$f"; then
              echo "FAILED: $f"
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures JS file(s) failed syntax check"
            exit 1
          fi
          echo "All static JS files passed node --check"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - name: Bandit report (artifact only)
        # The JSON dump is for humans; it must not decide the build. It covers
        # MORE than the gate on purpose — visibility is free, a red gate is not.
        run: |
          bandit -r kazma-core/kazma_core kazma-gateway/kazma_gateway kazma-ui/kazma_ui \
            kazma-cli/kazma_cli kazma-skills/kazma_skills kazma-tui/kazma_tui \
            tests scripts \
            -f json -o bandit-report.json || true
      - name: Bandit (high severity + high confidence — GATE)
        # This used to end in `|| true`, which meant the job named "Security
        # Scan" was green no matter what bandit found — a scan nobody could
        # ever fail is decoration, not a gate (audit 2026-09-16 F-7).
        # `-lll` = HIGH severity only, `-ii` = MEDIUM confidence and above
        # (bandit's flags are cumulative thresholds, not exact levels), so the
        # gate stays actionable rather than a wall of low-confidence noise.
        # The nine findings this surfaced were fixed, not suppressed.
        #
        # 2026-09-17: kazma-cli / kazma-skills / kazma-tui were never scanned
        # at all. They are clean at this threshold, so they join the gate.
        run: |
          bandit -r kazma-core/kazma_core kazma-gateway/kazma_gateway kazma-ui/kazma_ui \
            kazma-cli/kazma_cli kazma-skills/kazma_skills kazma-tui/kazma_tui \
            -lll -ii
      - name: Bandit B613 trojansource (GATE — every directory)
        # Narrow gate, widest scope, and the only check applied to tests and
        # scripts. A source file holding live bidi controls renders differently
        # from how it compiles (CVE-2021-42574); a test file does that just as
        # well as product code, and `tests/` is not in the gate above.
        #
        # Not hypothetical: this fired twice on 2026-09-17 — once in the HITL
        # card's own invisible-character table, and once in
        # test_arabic_text.py, which had been carrying literal LRM/RLM in a
        # directory nothing scanned.
        #
        # The rest of tests/ and scripts/ stays out of the gate deliberately:
        # the findings there are a test importing ftplib to test FTP backup, a
        # jinja2 fixture with autoescape off, and npm shelling on Windows.
        # Gating those makes a job that is red on day one, which is a job
        # everybody learns to ignore — exactly how the `|| true` gap opened.
        # They are in the artifact above. See docs/KNOWN_GAPS.md.
        run: |
          bandit -r kazma-core/kazma_core kazma-gateway/kazma_gateway kazma-ui/kazma_ui \
            kazma-cli/kazma_cli kazma-skills/kazma_skills kazma-tui/kazma_tui \
            tests scripts \
            -t B613 -ii
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
