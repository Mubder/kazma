name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install core deps
        run: pip install -e .
      - name: Compile all Python files
        run: |
          python -c "
          import py_compile, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              if '.venv' in str(f) or 'node_modules' in str(f):
                  continue
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              for e in errors: print(e)
              exit(1)
          print(f'All Python files compiled OK')
          "

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Run Ruff (syntax/undefined names — GATE)
        run: ruff check kazma-core/kazma_core/ kazma-gateway/kazma_gateway/ kazma-ui/kazma_ui/ --select E9,F63,F7,F82
      - name: Run Ruff (full — advisory)
        run: ruff check kazma-core/kazma_core/ kazma-gateway/kazma_gateway/ kazma-ui/kazma_ui/ --exit-zero

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        # Extra light pure-wheel deps (deep-audit 2026-08-19, finding #20)
        # un-skip the PIL / pymupdf / sqlite-vec / pypdfium2 test suites that
        # otherwise `importorskip` silently on the merge gate. numpy un-degrades
        # the PPR power iteration (without it compute_local_ppr returns uniform
        # seed weights and the memory-graph tests fail on the degraded path).
        # Playwright smoke is a *separate* job (boot-wait polls /health/live).
        # torch-bearing extras (rag) are too heavy for CI.
        run: pip install -e ".[test]" pillow pymupdf sqlite-vec pypdfium2 numpy
      - name: Install Arabic rendering system deps
        # The visual RTL tests (tests/test_docx_rtl_visual.py) render DOCX
        # through LibreOffice and measure where glyphs land on the page. They
        # are the only Arabic tests that cannot lie — and they skipped on every
        # CI run, because soffice and the Arabic fonts were never installed. The
        # w:jc-inversion class of bug was free to come back green.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer fonts-noto-naskh-arabic fonts-noto-core \
            tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Run tests (GATE — failures fail CI)
        # Industry eval pack (tests/test_eval_pack.py, marker `eval`) is in
        # tests/ and is collected by fast_test.py — do not exclude it.
        # Crash-tolerant chunked runner (scripts/fast_test.py): the bare
        # monolithic pytest run takes 20+ min and intermittently segfaults
        # (native lib), killing the run with no results. The chunked runner
        # executes file-chunks as independent serial pytest processes,
        # retries crashed chunks per-file, and still gates on every failure.
        run: python scripts/fast_test.py --chunks 4 --chunk-timeout 1500
        env:
          KAZMA_DB_BACKEND: sqlite
      - name: Metrics check
        run: python scripts/generate_metrics.py --check || true

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install app + Playwright
        run: |
          pip install -e ".[test,web]"
          python -m playwright install chromium --with-deps
      - name: Health + composer smoke
        run: python -m pytest tests/e2e/test_smoke.py -q --timeout=180
        env:
          KAZMA_DB_BACKEND: sqlite

  windows-selector-loop:
    name: Windows selector-loop subset
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test deps
        run: pip install -e ".[test]"
      - name: Compile-check + selector-loop regressions
        run: |
          python -c "import py_compile, pathlib; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('kazma-core/kazma_core').rglob('*.py')]"
          python -m pytest tests/test_audit_2026_08_31_strengthen.py tests/test_audit_deep_structure_fixes.py -q --timeout=120
        env:
          KAZMA_DB_BACKEND: sqlite

  js-check:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check all static JS
        run: |
          failures=0
          for f in $(find kazma-ui/kazma_ui/static/js -name '*.js'); do
            if ! node --check "$f"; then
              echo "FAILED: $f"
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures JS file(s) failed syntax check"
            exit 1
          fi
          echo "All static JS files passed node --check"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - name: Run Bandit (high severity only)
        run: |
          bandit -r kazma-core/kazma_core kazma-gateway/kazma_gateway kazma-ui/kazma_ui \
            -f json -o bandit-report.json || true
          bandit -r kazma-core/kazma_core kazma-gateway/kazma_gateway kazma-ui/kazma_ui \
            -lll -ii || true
