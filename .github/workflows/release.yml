# Manual release — only place the middle digit ("12") or major can move.
#
# * patch  — light (default); no confirmation
# * minor  — requires typing CONFIRM (e.g. 0.12.x → 0.13.0)
# * major  — requires typing CONFIRM (deliberate 1.0.0+)
#
# Always embeds +gSHORTSHA in pyproject / kazma.yaml (PEP 440 local).
# See docs/VERSIONING.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      force_level:
        description: "Bump level. minor/major need confirm=CONFIRM."
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      confirm:
        description: 'Type CONFIRM to allow minor or major (middle/major digit). Leave empty for patch.'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Light / confirmed release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guard minor/major confirmation
        env:
          LEVEL: ${{ github.event.inputs.force_level }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$LEVEL" == "minor" || "$LEVEL" == "major" ]]; then
            if [[ "$CONFIRM" != "CONFIRM" ]]; then
              echo "::error::level=$LEVEL refused — type confirm=CONFIRM to move the middle/major digit"
              exit 1
            fi
            echo "Confirmed $LEVEL bump"
          else
            echo "Patch-level light release (no confirmation required)"
          fi

      - name: Bump version
        env:
          LEVEL: ${{ github.event.inputs.force_level }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$LEVEL" == "minor" || "$LEVEL" == "major" ]]; then
            EXTRA=(--confirm CONFIRM)
          fi
          python scripts/light_version_bump.py \
            --level "$LEVEL" \
            "${EXTRA[@]}" \
            --write \
            --commit \
            --tag

      - name: Push commit and tags
        run: |
          set -euo pipefail
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          print(m.group(1) if m else "")
          PY
          )
          PUBLIC="${VER%%+*}"
          TAG="v${PUBLIC}"
          NOTES="Kazma **${VER}** (public tag ${TAG})"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" || \
            gh release edit "$TAG" --notes "$NOTES" || true
