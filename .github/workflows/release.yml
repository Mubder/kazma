# Manual GitHub Release from the current fixed base + commit SHA.
# Does NOT bump version digits (that is hand-edit only).
#
# Display version is always computed as {base}+g{shortsha}
# (see docs/VERSIONING.md + kazma_core.version).
name: Release

on:
  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create annotated git tag v{base} if missing"
        required: true
        default: true
        type: boolean
      notes:
        description: "Optional release notes (markdown)"
        required: false
        default: ""
        type: string

# Read-only for the workflow; the one job that writes says what it writes
# (OpenSSF Scorecard's Token-Permissions: a write granted to the whole
# workflow reaches every job added to it later).
permissions:
  contents: read

jobs:
  # Three jobs, in order: the wheel and the source archive are built (Linux),
  # the Windows installer is built from that same archive (a Windows runner:
  # Inno Setup is a Windows program), then everything is checksummed,
  # attested, Sigstore-signed, checked and published (Linux). The build's
  # checksums travel with the files and are checked again in each job.
  build:
    name: Build the wheel and the source archive
    runs-on: ubuntu-latest
    permissions:
      # The release tag is pushed here.
      contents: write
    outputs:
      base: ${{ steps.ver.outputs.base }}
      full: ${{ steps.ver.outputs.full }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # The job's token (contents: write) stays out of .git/config, where
          # every later step and tool could read it; only the tag push below
          # is handed it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          print((m.group(1) if m else "0.0.0").split("+", 1)[0])
          PY
          )
          SHA=$(git rev-parse --short=7 HEAD)
          FULL="${BASE}+g${SHA}"
          TAG="v${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved display version: ${FULL} (tag ${TAG})"

      - name: Configure git identity
        if: ${{ inputs.create_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create annotated tag (if missing)
        if: ${{ inputs.create_tag }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          FULL: ${{ steps.ver.outputs.full }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — leave as-is"
          else
            git tag -a "${TAG}" -m "Kazma ${FULL}"
            # The token for this one push, as checkout would have set it.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::${auth}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push origin "refs/tags/${TAG}"
            echo "Created ${TAG}"
          fi

      # ── Supply chain ────────────────────────────────────────────────────
      # A release that is only a tag asks the operator to trust GitHub's copy
      # of a zip. Enterprise and gov buyers — the third row of the positioning
      # table — will not do that, and they are right not to. Everything below
      # exists so a stranger can verify the artifact was built from this repo,
      # at this commit, by this workflow, and see exactly what is inside it.
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # The versions this release was tested with: uv.lock as a constraints
      # file, every extra included, written into the package before it is
      # built (pyproject's hatch `artifacts` takes it although git ignores
      # it). `kazma update` reads it from the verified wheel and installs
      # exactly these versions, so the wheel's signature covers them.
      # --locked refuses a lock that no longer matches pyproject.toml.
      - name: Write the locked versions into the package
        run: |
          set -euo pipefail
          uv export --locked --no-dev --no-emit-project --no-hashes --no-header --all-extras \
            --format requirements-txt -o kazma-cli/kazma_cli/locked_versions.txt
          grep -c '==' kazma-cli/kazma_cli/locked_versions.txt

      - name: Build wheel + sdist
        run: |
          set -euo pipefail
          # Built with the locked, hash-checked build backend (uv.lock's
          # `build` group), never a hatchling fetched unpinned at release time.
          uv export --locked --only-group build --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/build-constraints.txt"
          uv build --build-constraints "$RUNNER_TEMP/build-constraints.txt" --require-hashes \
            --out-dir dist
          ls -la dist
          # The wheel must carry its locked versions (kazma update installs them).
          python3 -c "import glob,sys,zipfile; w=glob.glob('dist/kazma-*.whl')[0]; n=zipfile.ZipFile(w).namelist(); sys.exit(0 if 'kazma_cli/locked_versions.txt' in n else 'the wheel carries no locked versions')"
          # Checksums of the built files, taken before any other tool runs
          # (the SBOM generator below is fetched at run time). They
          # live outside dist/ so they are not uploaded; every later step that
          # signs or publishes checks them again, so a tool that rewrote a
          # built file cannot have it signed unnoticed.
          sha256sum dist/kazma-*.whl dist/kazma-*.tar.gz > build-artifacts.sha256
          cat build-artifacts.sha256

      - name: Hand the built files to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kazma-dist
          path: |
            dist/
            build-artifacts.sha256
          if-no-files-found: error
          retention-days: 7

  # The Windows installer (scripts/windows_installer, REMAINING 2.7), from the
  # source archive the build job made: build.py reads it with the updater's
  # own rules and lays it out with the release-install marker. Signed here by
  # the service the repository variable KAZMA_WINDOWS_SIGNING names:
  # "signpath" (SignPath Foundation), "ssl-com" (SSL.com eSigner) or
  # "artifact-signing" (Microsoft). Moving from one to another is that one
  # variable and the new service's secrets (docs/SUPPLY_CHAIN.md says what
  # each needs). Unset, the installer is published unsigned and the run says
  # so; any other value fails the job.
  windows-installer:
    name: Build the Windows installer
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read
      # SignPath's connector reads this job and downloads the unsigned
      # installer from its artifact with the run's token.
      actions: read
      # Artifact Signing signs in to Azure with the run's OIDC token: no
      # secret is stored.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Take the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kazma-dist

      - name: Build the installer from the source archive
        shell: bash
        env:
          BASE: ${{ needs.build.outputs.base }}
        run: |
          set -euo pipefail
          # The archive is the one the build job made, unchanged.
          sha256sum -c build-artifacts.sha256
          python scripts/windows_installer/build.py --source "dist/kazma-${BASE}.tar.gz" \
            --out installer --install-inno

      # One shared step signs here and in the manual signing test
      # (windows-signing-test.yml): the service is the repository variable
      # KAZMA_WINDOWS_SIGNING, and each service's secrets and variables are
      # handed in whole, so changing service is the variable and its secrets.
      - name: Sign the installer
        uses: ./.github/actions/sign-windows-installer
        with:
          service: ${{ vars.KAZMA_WINDOWS_SIGNING }}
          environment: release
          folder: installer
          signpath-api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          signpath-organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          signpath-project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signpath-signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          signpath-artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          ssl-com-username: ${{ secrets.SSL_COM_USERNAME }}
          ssl-com-password: ${{ secrets.SSL_COM_PASSWORD }}
          ssl-com-credential-id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          ssl-com-totp-secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          azure-client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SIGNING_SUBSCRIPTION_ID }}
          azure-endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          azure-account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          azure-profile: ${{ vars.AZURE_SIGNING_PROFILE }}

      - name: Hand the installer to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kazma-installer
          path: installer/kazma-*-windows-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag + GitHub Release (no version bump)
    runs-on: ubuntu-latest
    needs: [build, windows-installer]
    permissions:
      contents: write
      # Keyless Sigstore signing and SLSA provenance both mint an OIDC token
      # for this workflow run — that identity is what a verifier checks
      # against, and it is why there is no private key to leak or rotate.
      id-token: write
      attestations: write
      # actions/attest v4 writes an artifact storage record beside the provenance.
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Take the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kazma-dist

      - name: Take the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kazma-installer
          path: dist

      - name: Check the built files and add the installer
        run: |
          set -euo pipefail
          # Unchanged since the build job checksummed them.
          sha256sum -c build-artifacts.sha256
          # The installer joins the list from here on: every later step checks it too.
          sha256sum dist/kazma-*-windows-setup.exe >> build-artifacts.sha256
          ls -la dist

      - name: Generate CycloneDX SBOM
        env:
          BASE: ${{ needs.build.outputs.base }}
        run: |
          set -euo pipefail
          # From the lockfile, not the build environment: the lock is the exact
          # pinned set a `uv sync` installs, so the SBOM describes what the user
          # actually runs rather than whatever the runner happened to resolve.
          # --locked is load-bearing. Without it `uv export` re-resolves and can
          # rewrite uv.lock mid-release, which would mean the SBOM described a
          # dependency set that was never committed or reviewed; and unlike
          # --frozen it refuses a lock that no longer matches pyproject.toml
          # (by 2026-10-02 the lock still pinned kazma 0.10.0, a removed
          # dependency, and versions pyproject's minimums now refuse).
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            -o requirements.lock.txt
          # From uv.lock's `sbom` group, its dependencies hash-checked: uvx
          # pinned only the tool (tests/test_installs_pinned_by_hash.py).
          uv run --frozen --no-build --only-group sbom cyclonedx-py requirements requirements.lock.txt \
            --of JSON -o "dist/kazma-${BASE}.cdx.json" \
            --sv 1.6 --output-reproducible
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print('SBOM components:', len(d.get('components') or []))" \
            "dist/kazma-${BASE}.cdx.json"
          # The tool above ran after the build: the wheel and the sdist must
          # still be what `uv build` made. The SBOM's own checksum joins the
          # list only now that it exists.
          sha256sum -c build-artifacts.sha256
          sha256sum "dist/kazma-${BASE}.cdx.json" >> build-artifacts.sha256

      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum -c build-artifacts.sha256
          cd dist
          sha256sum kazma-*.whl kazma-*.tar.gz kazma-*.cdx.json kazma-*-windows-setup.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Verify the built files before attesting
        run: |
          set -euo pipefail
          sha256sum -c build-artifacts.sha256
          (cd dist && sha256sum -c SHA256SUMS)

      # Answers "was this really built from Mubder/kazma at this commit?".
      # Verify with: gh attestation verify <file> --repo Mubder/kazma
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/kazma-*.whl,dist/kazma-*.tar.gz,dist/kazma-*.cdx.json,dist/kazma-*-windows-setup.exe"

      # Keyless signature bundles (<file>.sigstore.json) beside each file,
      # made by sigstore-python itself. The action that wrapped it
      # (sigstore/gh-action-sigstore-python) brings in actions/upload-artifact
      # and softprops/action-gh-release by tag, which this repository refuses
      # (every action pinned to a full commit SHA): the 0.21.2 release could
      # not start its job (2026-11-11). The version is uv.lock's, the one
      # `kazma update` verifies with (tests/test_release_supply_chain.py).
      - name: Sign artifacts with Sigstore
        run: |
          set -euo pipefail
          sha256sum -c build-artifacts.sha256
          (cd dist && sha256sum -c SHA256SUMS)
          # From uv.lock's `sign` group (sigstore and every dependency
          # hash-checked), in the job that holds the signing identity.
          uv run --frozen --no-build --only-group sign sigstore sign \
            dist/kazma-*.whl dist/kazma-*.tar.gz dist/kazma-*.cdx.json dist/kazma-*-windows-setup.exe \
            dist/SHA256SUMS
          ls -la dist

      # Every bundle passes the rule the updater applies (issuer, this
      # repository, this workflow from main or a v* tag) before anything is
      # published: a release it would refuse is never published.
      - name: Verify the signatures as kazma update does
        run: |
          set -euo pipefail
          uv run --frozen --no-build --only-group sign python scripts/verify_release_signatures.py dist
          sha256sum -c build-artifacts.sha256

      # Every release is tested as an upgrade from the one before (REMAINING
      # 2.6): the previous release installed with its own locked versions, run
      # on a data folder of its own, upgraded to this wheel as `kazma update`
      # does, and run again on that data (scripts/upgrade_drill.py). A release
      # that cannot be upgraded to is never published.
      - name: Upgrade from the previous release (GATE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run --frozen python scripts/upgrade_drill.py --wheel "dist/kazma-*.whl"
          sha256sum -c build-artifacts.sha256

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          FULL: ${{ needs.build.outputs.full }}
          NOTES_IN: ${{ inputs.notes }}
          BASE: ${{ needs.build.outputs.base }}
        run: |
          set -euo pipefail
          # Nothing between the build and here may have changed a file.
          sha256sum -c build-artifacts.sha256
          (cd dist && sha256sum -c SHA256SUMS)
          if [[ -n "${NOTES_IN}" ]]; then
            NOTES="${NOTES_IN}"
          else
            NOTES="Kazma **${FULL}** (public base tag ${TAG}).

          Display version always embeds the commit id: \`{base}+g{shortsha}\`.
          Digits are not auto-bumped; change the base in \`pyproject.toml\` by hand when you want a new milestone.

          ### Verifying this release

          Every artifact is signed with Sigstore (keyless — no key to leak) and
          carries SLSA build provenance. See [docs/SUPPLY_CHAIN.md](https://github.com/Mubder/kazma/blob/main/docs/SUPPLY_CHAIN.md).

          \`\`\`bash
          gh attestation verify kazma-${BASE}-py3-none-any.whl --repo Mubder/kazma
          sha256sum -c SHA256SUMS
          \`\`\`

          \`kazma-${BASE}.cdx.json\` is a CycloneDX 1.6 SBOM of the locked dependency set.

          ### Windows

          \`kazma-${BASE}-windows-setup.exe\` installs Kazma with no git and no terminal, then
          \`kazma update\` keeps it current from each release's signed source archive."
          fi
          # A draft first, every file attached, published last. A published
          # release's files are never replaced: with GitHub's immutable
          # releases on they cannot be, and an updater that checks SHA256SUMS
          # must never meet a release whose files changed under it.
          STATE=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "${STATE}" in
            missing)
              gh release create "${TAG}" --draft --title "${TAG}" --notes "${NOTES}" dist/*
              ;;
            true)
              # A draft an earlier run left behind: finish it.
              gh release edit "${TAG}" --title "${TAG}" --notes "${NOTES}"
              gh release upload "${TAG}" dist/* --clobber
              ;;
            *)
              echo "::error::Release ${TAG} is already published and its files are not replaced. Raise the version in pyproject.toml and run again."
              exit 1
              ;;
          esac
          gh release edit "${TAG}" --draft=false
