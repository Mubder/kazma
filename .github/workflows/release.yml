# Manual GitHub Release from the current fixed base + commit SHA.
# Does NOT bump version digits (that is hand-edit only).
#
# Display version is always computed as {base}+g{shortsha}
# (see docs/VERSIONING.md + kazma_core.version).
name: Release

on:
  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create annotated git tag v{base} if missing"
        required: true
        default: true
        type: boolean
      notes:
        description: "Optional release notes (markdown)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Tag + GitHub Release (no version bump)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          print((m.group(1) if m else "0.0.0").split("+", 1)[0])
          PY
          )
          SHA=$(git rev-parse --short=7 HEAD)
          FULL="${BASE}+g${SHA}"
          TAG="v${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved display version: ${FULL} (tag ${TAG})"

      - name: Configure git identity
        if: ${{ inputs.create_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create annotated tag (if missing)
        if: ${{ inputs.create_tag }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          FULL: ${{ steps.ver.outputs.full }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — leave as-is"
          else
            git tag -a "${TAG}" -m "Kazma ${FULL}"
            git push origin "refs/tags/${TAG}"
            echo "Created ${TAG}"
          fi

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          FULL: ${{ steps.ver.outputs.full }}
          NOTES_IN: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ -n "${NOTES_IN}" ]]; then
            NOTES="${NOTES_IN}"
          else
            NOTES="Kazma **${FULL}** (public base tag ${TAG}).

          Display version always embeds the commit id: \`{base}+g{shortsha}\`.
          Digits are not auto-bumped; change the base in \`pyproject.toml\` by hand when you want a new milestone."
          fi
          gh release create "${TAG}" --title "${TAG}" --notes "${NOTES}" || \
            gh release edit "${TAG}" --notes "${NOTES}" || true
