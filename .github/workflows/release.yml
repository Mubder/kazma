# Manual GitHub Release from the current fixed base + commit SHA.
# Does NOT bump version digits (that is hand-edit only).
#
# Display version is always computed as {base}+g{shortsha}
# (see docs/VERSIONING.md + kazma_core.version).
name: Release

on:
  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create annotated git tag v{base} if missing"
        required: true
        default: true
        type: boolean
      notes:
        description: "Optional release notes (markdown)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  # Keyless Sigstore signing and SLSA provenance both mint an OIDC token for
  # this workflow run — that identity is what a verifier checks against, and
  # it is why there is no private key to leak or rotate.
  id-token: write
  attestations: write

jobs:
  release:
    name: Tag + GitHub Release (no version bump)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          print((m.group(1) if m else "0.0.0").split("+", 1)[0])
          PY
          )
          SHA=$(git rev-parse --short=7 HEAD)
          FULL="${BASE}+g${SHA}"
          TAG="v${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved display version: ${FULL} (tag ${TAG})"

      - name: Configure git identity
        if: ${{ inputs.create_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create annotated tag (if missing)
        if: ${{ inputs.create_tag }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          FULL: ${{ steps.ver.outputs.full }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — leave as-is"
          else
            git tag -a "${TAG}" -m "Kazma ${FULL}"
            git push origin "refs/tags/${TAG}"
            echo "Created ${TAG}"
          fi

      # ── Supply chain ────────────────────────────────────────────────────
      # A release that is only a tag asks the operator to trust GitHub's copy
      # of a zip. Enterprise and gov buyers — the third row of the positioning
      # table — will not do that, and they are right not to. Everything below
      # exists so a stranger can verify the artifact was built from this repo,
      # at this commit, by this workflow, and see exactly what is inside it.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build wheel + sdist
        run: |
          set -euo pipefail
          uv build --out-dir dist
          ls -la dist
          # Checksums of the built files, taken before any other tool runs
          # (the SBOM generator below is fetched at run time). They
          # live outside dist/ so they are not uploaded; every later step that
          # signs or publishes checks them again, so a tool that rewrote a
          # built file cannot have it signed unnoticed.
          sha256sum dist/kazma-*.whl dist/kazma-*.tar.gz > build-artifacts.sha256
          cat build-artifacts.sha256

      - name: Generate CycloneDX SBOM
        env:
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          set -euo pipefail
          # From the lockfile, not the build environment: the lock is the exact
          # pinned set a `uv sync` installs, so the SBOM describes what the user
          # actually runs rather than whatever the runner happened to resolve.
          # --locked is load-bearing. Without it `uv export` re-resolves and can
          # rewrite uv.lock mid-release, which would mean the SBOM described a
          # dependency set that was never committed or reviewed; and unlike
          # --frozen it refuses a lock that no longer matches pyproject.toml
          # (by 2026-10-02 the lock still pinned kazma 0.10.0, a removed
          # dependency, and versions pyproject's minimums now refuse).
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            -o requirements.lock.txt
          # An exact version: uvx would otherwise run whatever PyPI serves that
          # day (tests/test_actions_pinned_by_sha.py).
          uvx --from cyclonedx-bom==8.0.1 cyclonedx-py requirements requirements.lock.txt \
            --of JSON -o "dist/kazma-${BASE}.cdx.json" \
            --sv 1.6 --output-reproducible
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print('SBOM components:', len(d.get('components') or []))" \
            "dist/kazma-${BASE}.cdx.json"
          # The tool above ran after the build: the wheel and the sdist must
          # still be what `uv build` made. The SBOM's own checksum joins the
          # list only now that it exists.
          sha256sum -c build-artifacts.sha256
          sha256sum "dist/kazma-${BASE}.cdx.json" >> build-artifacts.sha256

      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum -c build-artifacts.sha256
          cd dist
          sha256sum kazma-*.whl kazma-*.tar.gz kazma-*.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Verify the built files before attesting
        run: |
          set -euo pipefail
          sha256sum -c build-artifacts.sha256
          (cd dist && sha256sum -c SHA256SUMS)

      # Answers "was this really built from Mubder/kazma at this commit?".
      # Verify with: gh attestation verify <file> --repo Mubder/kazma
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/kazma-*.whl,dist/kazma-*.tar.gz,dist/kazma-*.cdx.json"

      # Keyless signature bundles (*.sigstore.json) next to each artifact.
      # Verify with: python -m sigstore verify identity ...
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: |
            ./dist/kazma-*.whl
            ./dist/kazma-*.tar.gz
            ./dist/kazma-*.cdx.json
            ./dist/SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          FULL: ${{ steps.ver.outputs.full }}
          NOTES_IN: ${{ inputs.notes }}
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          set -euo pipefail
          # Nothing between the build and here may have changed a file.
          sha256sum -c build-artifacts.sha256
          (cd dist && sha256sum -c SHA256SUMS)
          if [[ -n "${NOTES_IN}" ]]; then
            NOTES="${NOTES_IN}"
          else
            NOTES="Kazma **${FULL}** (public base tag ${TAG}).

          Display version always embeds the commit id: \`{base}+g{shortsha}\`.
          Digits are not auto-bumped; change the base in \`pyproject.toml\` by hand when you want a new milestone.

          ### Verifying this release

          Every artifact is signed with Sigstore (keyless — no key to leak) and
          carries SLSA build provenance. See [docs/SUPPLY_CHAIN.md](https://github.com/Mubder/kazma/blob/main/docs/SUPPLY_CHAIN.md).

          \`\`\`bash
          gh attestation verify kazma-${BASE}-py3-none-any.whl --repo Mubder/kazma
          sha256sum -c SHA256SUMS
          \`\`\`

          \`kazma-${BASE}.cdx.json\` is a CycloneDX 1.6 SBOM of the locked dependency set."
          fi
          # A draft first, every file attached, published last. A published
          # release's files are never replaced: with GitHub's immutable
          # releases on they cannot be, and an updater that checks SHA256SUMS
          # must never meet a release whose files changed under it.
          STATE=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "${STATE}" in
            missing)
              gh release create "${TAG}" --draft --title "${TAG}" --notes "${NOTES}" dist/*
              ;;
            true)
              # A draft an earlier run left behind: finish it.
              gh release edit "${TAG}" --title "${TAG}" --notes "${NOTES}"
              gh release upload "${TAG}" dist/* --clobber
              ;;
            *)
              echo "::error::Release ${TAG} is already published and its files are not replaced. Raise the version in pyproject.toml and run again."
              exit 1
              ;;
          esac
          gh release edit "${TAG}" --draft=false
