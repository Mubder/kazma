# Manual GitHub Release from the current fixed base + commit SHA.
# Does NOT bump version digits (that is hand-edit only).
#
# Display version is always computed as {base}+g{shortsha}
# (see docs/VERSIONING.md + kazma_core.version).
name: Release

on:
  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create annotated git tag v{base} if missing"
        required: true
        default: true
        type: boolean
      notes:
        description: "Optional release notes (markdown)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  # Keyless Sigstore signing and SLSA provenance both mint an OIDC token for
  # this workflow run — that identity is what a verifier checks against, and
  # it is why there is no private key to leak or rotate.
  id-token: write
  attestations: write

jobs:
  release:
    name: Tag + GitHub Release (no version bump)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          print((m.group(1) if m else "0.0.0").split("+", 1)[0])
          PY
          )
          SHA=$(git rev-parse --short=7 HEAD)
          FULL="${BASE}+g${SHA}"
          TAG="v${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved display version: ${FULL} (tag ${TAG})"

      - name: Configure git identity
        if: ${{ inputs.create_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create annotated tag (if missing)
        if: ${{ inputs.create_tag }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          FULL: ${{ steps.ver.outputs.full }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — leave as-is"
          else
            git tag -a "${TAG}" -m "Kazma ${FULL}"
            git push origin "refs/tags/${TAG}"
            echo "Created ${TAG}"
          fi

      # ── Supply chain ────────────────────────────────────────────────────
      # A release that is only a tag asks the operator to trust GitHub's copy
      # of a zip. Enterprise and gov buyers — the third row of the positioning
      # table — will not do that, and they are right not to. Everything below
      # exists so a stranger can verify the artifact was built from this repo,
      # at this commit, by this workflow, and see exactly what is inside it.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel + sdist
        run: |
          set -euo pipefail
          uv build --out-dir dist
          ls -la dist

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          # From the lockfile, not the build environment: the lock is the exact
          # pinned set a `uv sync` installs, so the SBOM describes what the user
          # actually runs rather than whatever the runner happened to resolve.
          # --frozen is load-bearing. Without it `uv export` re-resolves and can
          # rewrite uv.lock mid-release, which would mean the SBOM described a
          # dependency set that was never committed or reviewed.
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            -o requirements.lock.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements.lock.txt \
            --of JSON -o "dist/kazma-${{ steps.ver.outputs.base }}.cdx.json" \
            --sv 1.6 --output-reproducible
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print('SBOM components:', len(d.get('components') or []))" \
            "dist/kazma-${{ steps.ver.outputs.base }}.cdx.json"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum kazma-*.whl kazma-*.tar.gz kazma-*.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # Answers "was this really built from Mubder/kazma at this commit?".
      # Verify with: gh attestation verify <file> --repo Mubder/kazma
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/kazma-*.whl,dist/kazma-*.tar.gz,dist/kazma-*.cdx.json"

      # Keyless signature bundles (*.sigstore.json) next to each artifact.
      # Verify with: python -m sigstore verify identity ...
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            ./dist/kazma-*.whl
            ./dist/kazma-*.tar.gz
            ./dist/kazma-*.cdx.json
            ./dist/SHA256SUMS

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          FULL: ${{ steps.ver.outputs.full }}
          NOTES_IN: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ -n "${NOTES_IN}" ]]; then
            NOTES="${NOTES_IN}"
          else
            NOTES="Kazma **${FULL}** (public base tag ${TAG}).

          Display version always embeds the commit id: \`{base}+g{shortsha}\`.
          Digits are not auto-bumped; change the base in \`pyproject.toml\` by hand when you want a new milestone.

          ### Verifying this release

          Every artifact is signed with Sigstore (keyless — no key to leak) and
          carries SLSA build provenance. See [docs/SUPPLY_CHAIN.md](https://github.com/Mubder/kazma/blob/main/docs/SUPPLY_CHAIN.md).

          \`\`\`bash
          gh attestation verify kazma-${{ steps.ver.outputs.base }}-py3-none-any.whl --repo Mubder/kazma
          sha256sum -c SHA256SUMS
          \`\`\`

          \`kazma-${{ steps.ver.outputs.base }}.cdx.json\` is a CycloneDX 1.6 SBOM of the locked dependency set."
          fi
          gh release create "${TAG}" --title "${TAG}" --notes "${NOTES}" \
            || gh release edit "${TAG}" --notes "${NOTES}" \
            || true
          # --clobber so re-running the workflow replaces assets instead of failing.
          gh release upload "${TAG}" dist/* --clobber
