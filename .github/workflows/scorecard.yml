# OpenSSF Scorecard: a weekly check of the repository's security practices
# (pinned dependencies, token permissions, branch protection, signed
# releases...), published to the OpenSSF Scorecard API and shown in GitHub's
# code scanning. OSTIF and the other audit programmes ask to see it before an
# independent review (docs/audits/SECURITY_REVIEW_PACK_2026-11.md).
#
# Scorecard publishes only from a workflow it can trust: no top-level env or
# defaults, and only its approved actions in the job (checkout, upload-artifact,
# upload-sarif). Keep it that way. It runs weekly and by hand, never on every
# push: the score moves with the repository's settings, not with each commit.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
