# Kazma Security Configuration
# Declares scanning, disclosure workflow, bounty posture, and hardening checks.
# This file is policy posture — confirm runtime enforcement against the
# hardening runner and SECURITY.md before relying on every check in production.

scanning:
  enabled: true
  interval: "24h"
  sources:
    - osv
    - github_advisories
    - nvd
  auto_create_issues: true
  severity_threshold: medium
  ignore:
    - ""  # Add CVE IDs or package patterns to ignore

disclosure:
  enabled: true
  response_window: "48h"
  assessment_window: "7d"
  # RFC 9116 contact file (also served by the app at /.well-known/security.txt).
  # Not a PGP key URL — we do not publish a PGP key at this time.
  security_txt_url: "https://kazma.ai/.well-known/security.txt"
  encrypted_channels:
    - type: email
      address: "admin@kazma.ai"
    - type: github
      url: "https://github.com/Mubder/kazma/security/advisories/new"

# Paid bug bounty is OFF. Do not advertise payout tiers as active.
# Historical draft ranges below are reserved for a future program only.
bug_bounty:
  enabled: false
  min_payout: 0
  max_payout: 0
  currency: USD
  notes: "No paid bounty at this time. Responsible disclosure only — see SECURITY.md."
  tiers: {}

hardening:
  run_on_startup: true
  fail_on_critical: true
  auto_fix: false
  checks:
    - name: secrets_in_logs
      enabled: true
    - name: input_validation
      enabled: true
    - name: rbac_enforcement
      enabled: true
    - name: tls_required
      enabled: true
    - name: dependency_audit
      enabled: true
    - name: least_privilege
      enabled: true
    - name: audit_trail
      enabled: true
    - name: config_integrity
      enabled: true
