[project]
name = "kazma"
version = "0.21.2"
description = "Kazma — Autonomous AI agent framework with LangGraph, ChromaDB RAG, and Arabic RTL dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    # Imported unconditionally at module level (FastAPI request models;
    # kazma_gateway checkpoint RunnableConfig). Transitively present via
    # fastapi / langgraph today, but declared so a transitive change cannot
    # break the import (AUD-011). Optional deps imported behind a guard
    # (numpy, jsonschema, huggingface_hub, aiohttp) stay undeclared by design.
    "pydantic>=2.14.3",
    "langchain-core>=1.7.6",
    "aiosqlite>=0.20.0",
    "langfuse>=5.2.0",
    "pyyaml>=6.0",
    # Reads requirements and versions for the boot check that the installed
    # packages meet this build's minimums (kazma_core.install_requirements).
    "packaging>=26.3",
    "httpx>=0.27.0",
    # The default text-to-speech provider (voice.tts_provider = edgetts). 7.3.1
    # speaks the protocol Microsoft serves now: 7.2.8 is refused (FA-248).
    "edge-tts>=7.3.1",
    "cryptography>=50.0.0",
    # `kazma update` installs a release wheel only with a Sigstore signature
    # from Kazma's release workflow (kazma_cli/release_signature.py). Below 5:
    # the check uses its Verifier, policy and Bundle API as 4.x has them.
    "sigstore>=4.5.1,<5",
    "PyJWT>=2.15.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.33",
    "textual>=8.2.8",
    "psutil>=5.9.0",
    "websockets>=17.4",
    "duckduckgo-search>=6.0",
    "trafilatura>=2.3.1",
    "markdown>=3.11.3",
    "pygments>=2.21.0",
    # zoneinfo database — bare Windows/containers have no system tzdata;
    # cron.timezone (and anything using ZoneInfo) needs it to resolve names.
    "tzdata>=2026.6",
    "networkx>=3.1",
    "click>=8.5.1",
    "rich>=13.0.0",
    "google-cloud-aiplatform>=2.7.0",
    "python-dotenv>=1.2.4",
    "arabic-reshaper>=3.1.0",
    "python-bidi>=0.6.12",
    "reportlab>=5.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=7.1.0,<8",  # 7: the 7.0 security fixes; 7.1 tested 2026-11-13 (`kazma update` does not read uv.lock)
    "pdfplumber>=0.11.0",
    "python-pptx>=0.6.23",
    # Security floors (2026-10-02): packages Kazma runs on without importing
    # them by name. A minimum here is what makes `kazma update` (an additive
    # `uv pip install -e .`) upgrade an install that has an affected
    # version; the lock alone changes only fresh installs. Each floor is the
    # release that fixes an advisory (GET /api/security/hardening lists what
    # an install still has).
    "urllib3>=2.8.0",
    "anyio>=4.16.0",
    "pyasn1>=0.6.5",
    # 2026-11-07: GHSA-6q48-6c7w-9gw2 (emSign roots with compromised intermediates).
    "certifi>=2026.10.18",
    # 2026-10-07 OSV refresh: keep existing installs above these fixes too.
    "langgraph-sdk>=0.4.14",
    "multidict>=7.2.1",
    "werkzeug>=3.1.9",
]

[project.optional-dependencies]
dev = [
    # Everything the suite needs. setup.ps1 and setup.sh sync this extra, and
    # pytest's addopts name --timeout: without pytest-timeout pytest refused to
    # start on every fresh install (tests/test_setup_extras_run_the_suite.py).
    "kazma[test]",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "locust>=2.47.0",
    # Runs .pre-commit-config.yaml: the import gates (every module imports,
    # no dangling kazma_* refs) and the static gates (no blocking DB call on
    # the event loop, no fire-and-forget task, every tool tiered for HITL,
    # web tool output fenced). ~8s total. Activate once per clone with
    # `pre-commit install`; until you do, the hooks never fire.
    "pre-commit>=4.7.0",
    "virtualenv>=21.15.6",  # security floor (see the base list): pre-commit brings it
    # Security floors (see the base list) for what locust and pre-commit bring
    # in: OSV advisories fixed in these releases (tests/test_dependency_floors.py).
    "brotli>=1.2.1",
    "msgpack>=1.2.3",
    "filelock>=4.2.10",
]
test = [
    "sqlglot==30.30.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.17.0",
    "pytest-timeout>=2.3.0",
    "fakeredis>=2.39.0",
    "httpx>=0.27.0",
]
push = [
    # Web Push for task completion (Turn Delivery V2 P5). Optional: the
    # feature self-disables when absent — see kazma_ui/push.py.
    "pywebpush>=2.5.0",
    "aiohttp>=3.14.5",  # security floor (see the base list): pywebpush brings it
]
# Compatibility alias. textual and python-bidi are already base dependencies.
# Installing without this extra does not remove the TUI libraries.
tui = [
    "textual>=8.2.8",
    "python-bidi>=0.6.12",
]
rag = [
    # The local (Rust) store the Knowledge Library's fixes of 2026-10-15
    # were measured on (KB-Q01: collection configuration, close, modify).
    "chromadb>=1.5.9",
    "sentence-transformers>=6.2.0",
    "sqlite-vec>=0.1.6",  # L4 local vector layer (UnifiedMemoryAdapter)
    # Security floors for what these bring in (see the base list).
    "torch>=2.13.0",
    "transformers>=5.22.2",
    "oauthlib>=4.0.1",
    "aiohttp>=3.14.5",
    "setuptools>=84.2.1",
    "filelock>=4.2.10",
]
observability = [
    "prometheus-client>=0.26.0",
]
web = [
    "playwright>=1.65.1,<1.66",  # the bounded driver wires Playwright's private client: each minor is qualified (2026-11-13)
]
# Multi-replica / SaaS shared state (Phase 4.3)
postgres = [
    "psycopg[binary,pool]>=3.3.9",
    "langgraph-checkpoint-postgres>=3.1.3",
]
# Compatibility alias. These libraries are already base dependencies.
# Installing without this extra does not remove document generation.
document = [
    "reportlab>=5.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "arabic-reshaper>=3.1.0",
    "python-bidi>=0.6.12",
    "pypdf>=7.1.0,<8",  # 7: the 7.0 security fixes; 7.1 tested 2026-11-13 (`kazma update` does not read uv.lock)
    "pdfplumber>=0.11.0",
    "python-pptx>=0.6.23",
]
# OCR for scanned documents (requires system Tesseract install)
# apt install tesseract-ocr (Linux) | brew install tesseract (macOS)
# Windows: https://github.com/UB-Mannheim/tesseract/wiki
# The neural engine (documents.ocr.engine: neural/auto; Arabic and Arabic-Indic
# digits) runs on ONNX Runtime with OpenCV's image operations; its models are
# installed once with `python scripts/ocr_models.py install`. The minimums are
# the oldest versions its tests passed on (onnxruntime 1.27.0, OpenCV
# 4.12.0.88 with numpy 2.2), not security floors: no advisory names them.
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",  # security floor: OSV advisories fixed in 13.0.0
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=4.12.0.88",
    "pyclipper>=1.4.0",
    "numpy>=2.0.0",
]
# Document format conversion (HTML→PDF, Markdown→PDF)
convert = [
    "weasyprint>=70.0",
]
# Full Document Intelligence platform engines (parse/redact/render)
# System deps still needed: Tesseract (OCR), LibreOffice (some conversions),
# ClamAV clamscan/clamdscan (optional malware), OS fonts for WeasyPrint.
document-platform = [
    "kazma[document,ocr,convert]",
    # 2 untested (2026-11-09): its find_tables runs an ONNX layout model that
    # crashed the parser worker (SIGSEGV), and `kazma update` and CI's pip do
    # not read uv.lock, so an unbounded floor installed it.
    "pymupdf>=1.24.0,<2",
    # Optional PDFium peer in the multi-engine PDF bake-off (safe if unused).
    "pypdfium2>=5.15.2",
]
# Optional Docling local extract (hard PDFs; salvage after PyMuPDF)
docling = [
    "docling>=2.149.0",
    # Security floors for what docling brings in (see the base list).
    "torch>=2.13.0",
    "transformers>=5.22.2",
    "setuptools>=84.2.1",
    "filelock>=4.2.10",
    # Through beautifulsoup4: GHSA-mmhr-3c5m-f64f (fixed 4.0) and
    # GHSA-4j63-6c4x-wfg4 (fixed 2.10). soupsieve 4 needs Python 3.11.5,
    # where the lock keeps 2.10.
    "soupsieve>=4.0; python_full_version >= '3.11.5'",
]
# Codebase index (tree-sitter languages; regex fallback always works)
index = [
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]
# E2B Firecracker sandboxes (untrusted python_exec)
sandbox = [
    "e2b-code-interpreter>=2.11.9",
]
# Temporal durable swarm steps (crash-resume long work)
durable = [
    "temporalio>=1.35.0",
]
# The memory graph in Neo4j (memory.backends.graph.provider = neo4j). Without
# the driver the graph stays in SQLite and boot says so once.
neo4j = [
    "neo4j>=6.2.0",
]
# Database drivers beyond SQLite (database_client skill)
database = [
    "sqlglot==30.30.0",
    "psycopg[binary]>=3.3.9",
    "pymysql>=1.2.4",
    "pymongo>=4.18.3",
    "dnspython>=2.9.2",  # security floor (see the base list): pymongo brings it
]
# Convenience meta-extra — installs everything at once.
# Usage: pip install -e ".[all]"  or  uv sync --all-extras
all = [
    "kazma[rag,dev,tui,observability,web,postgres,document,database,ocr,convert,document-platform,sandbox,durable,index,docling,neo4j]",
]

[project.scripts]
kazma = "kazma_cli.main:main"
kazma-tui = "kazma_tui.app:main"
kazma-web = "kazma_ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kazma-core/kazma_core", "kazma-skills/kazma_skills", "kazma-ui/kazma_ui", "kazma-cli/kazma_cli", "kazma-tui/kazma_tui", "kazma-gateway/kazma_gateway"]

[tool.pytest.ini_options]
# Package suites + root regression corpus. TUI uses kazma_tui_tests to avoid
# ImportPathMismatch with root tests/conftest.py.
testpaths = [
    "kazma-core/kazma_core_tests",
    "kazma-core/tests",  # IDE / env_context / embedder suite (was orphaned from CI)
    # The bus/commands suite used to live at kazma-gateway/kazma_gateway/tests
    # — inside the shipped package, so test code was installed with it. Moved
    # to kazma_gateway_tests/adapters (audit O8); this path now covers both.
    "kazma-gateway/kazma_gateway_tests",
    "kazma-ui/kazma_ui_tests",
    "kazma-tui/kazma_tui_tests",
    "tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A hung test must FAIL, not stall. On 2026-09-14 a self-deadlock in
# ConfigStore.atomic_update stopped the suite dead at test ~250 of 8,217;
# three consecutive full runs sat at the same byte of output, the last for
# five hours, and none of them ever reported. A deadlock does not raise, so
# nothing failed -- the run simply never ended. The cap is deliberately far
# above the slowest honest test (the whole suite averages ~0.3s each) so it
# only ever catches something that is genuinely stuck. --timeout-method=thread
# is the one that works on Windows, and it dumps the stack of every thread,
# which is how the deadlock above was located in a single run.
addopts = "-v --strict-markers --tb=short --timeout=300 --timeout-method=thread"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "commitment: Commitment Layer tests (gate, resolvers, store, scope, soul)",
    "eval: Industry eval pack (golden trajectories, no live LLM)",
    "e2e: Browser smoke (Playwright; separate CI job)",
    "postgres: Verified against a real Postgres; the CI Postgres job runs these (scripts/postgres_suite.py)",
    "real_docker: Runs real containers on the developer's own Docker engine (the docker CLI's own settings are not swapped for an empty folder)",
]

[tool.coverage.run]
source = [
    "kazma-core/kazma_core",
    "kazma-gateway/kazma_gateway",
    "kazma-ui/kazma_ui",
    "kazma-cli/kazma_cli",
    "kazma-tui/kazma_tui",
    "kazma-skills/kazma_skills",
]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["examples/*", ".venv/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N806", "E501", "F841", "W293", "N801", "E402"]

[tool.ruff.lint.per-file-ignores]
[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "kazma_core.*"
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_vcs_release = true
build_command = ""
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
# Keep 0.x product line until we intentionally ship 1.0.0
# (allow_zero_version=false wrongly forced a jump to 1.0.0 — do not re-enable)
allow_zero_version = true

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "chore\\(release\\):.*",
    "Merge pull request.*",
    "Merge branch.*",
]

# Version digits are NOT auto-bumped (see docs/VERSIONING.md).
# Display = pyproject base + live +gSHORTSHA (kazma_core.version).
# semantic-release / commitizen kept only for optional local habits — CI
# does not run them for releases.
[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "ci", "chore", "build", "style"]
minor_tags = []
patch_tags = ["feat", "fix", "perf", "refactor"]
major_tags = []

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

# Commitizen is NOT used by CI anymore (too easy to minor-bump).
# Prefer: python scripts/light_version_bump.py
# Kept for optional local `cz` habits with patch-only map.
[tool.commitizen]
name = "cz_customize"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
version_files = [
    "pyproject.toml:version",
    "kazma.yaml:agent.version",
]
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): version $current_version → $new_version [skip ci]"

[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{message}}"
schema_pattern = "(?s)(build|ci|docs|feat|fix|perf|refactor|style|test|chore|revert|break)(\\([\\w\\-\\.]+\\))?(!)?:\\s.+"
bump_pattern = "^(break|BREAKING CHANGE|feat|fix|perf|refactor)(\\([\\w\\-\\.]+\\))?(!)?"
# Everything → PATCH. Middle digit only via light_version_bump --level minor --confirm CONFIRM
bump_map = {"break" = "PATCH", "BREAKING CHANGE" = "PATCH", "feat" = "PATCH", "fix" = "PATCH", "perf" = "PATCH", "refactor" = "PATCH"}
change_type_order = ["BREAKING CHANGE", "feat", "fix", "perf", "refactor", "docs", "chore"]
