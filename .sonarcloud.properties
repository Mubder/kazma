# SonarCloud's automatic analysis (2026-11-16): what is Kazma's code and what
# is its test code. Without this every test harness was read as product code:
# 134 of the first scan's Blocker/High findings were a test's own `eval` or a
# test page's fixture (AGENTS.md section 69).

sonar.projectName=Kazma

# Product code: everything but the tests, the vendored libraries and the
# evidence scripts kept beside the audits.
sonar.sources=.
sonar.exclusions=\
  tests/**,\
  kazma-core/tests/**,\
  **/*_tests/**,\
  deploy/observer/test/**,\
  fuzz/**,\
  **/static/vendor/**,\
  docs/audits/evidence/**,\
  examples/**,\
  docs/build/**,\
  docs/node_modules/**,\
  **/node_modules/**

# Test code: the suites pytest and node run (pyproject's testpaths, the
# Worker's tests, the fuzz targets).
sonar.tests=.
sonar.test.inclusions=\
  tests/**,\
  kazma-core/tests/**,\
  **/*_tests/**,\
  deploy/observer/test/**,\
  fuzz/**

sonar.python.version=3.11,3.12,3.13,3.14
