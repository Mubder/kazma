# Codecov's settings (app.codecov.io/gh/Mubder/kazma).
#
# .github/workflows/coverage.yml uploads one report per suite, and the suites
# finish hours apart. Without a count, Codecov reported each commit as soon as
# the first small suite landed: 31% for a commit whose whole total was 74%
# (2026-11-16). after_n_builds is the number of jobs that upload, held equal
# to the workflow by tests/test_codecov_waits_for_every_upload.py.
#
# Coverage measures and never gates (CI's jobs are the gates), so Codecov's
# statuses are informational: they never mark a commit failed.
codecov:
  notify:
    after_n_builds: 6

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false
