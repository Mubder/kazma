<div id="xs-panel-datasets" role="tabpanel" aria-labelledby="xs-tab-datasets" x-show="tab === 'datasets'" x-cloak>
  <section x-data="xDatasetPage()" class="xd-workspace" aria-label="{{ t('x_dataset.title') }}">
    <div class="xs-card">
      <h2>{{ t('x_dataset.title') }}</h2>
      <p>{{ t('x_dataset.intro') }}</p>
      <a href="https://kazma.ai{{ '/ar' if lang() == 'ar' else '' }}/docs/x-evaluation-dataset/">{{ t('x_dataset.guide') }}</a>
      <div class="xd-grid" style="margin-top:16px;">
        <div><label for="xd-name">{{ t('x_dataset.name') }}</label><input id="xd-name" name="dataset_name" autocomplete="off" maxlength="120" class="form-input" x-model="name" :disabled="busy"></div>
        <div><label for="xd-purpose">{{ t('x_dataset.purpose') }}</label><select id="xd-purpose" class="form-input" x-model="purpose" :disabled="busy">
          <option value="collection">{{ t('x_dataset.collection') }}</option><option value="tuning">{{ t('x_dataset.tuning') }}</option><option value="release">{{ t('x_dataset.release') }}</option>
        </select></div>
      </div>
      <div class="xd-actions"><button class="btn btn-primary" @click="create()" :disabled="busy">{{ t('x_dataset.create') }}</button>
        <label for="xd-import">{{ t('x_dataset.import') }}</label><input id="xd-import" type="file" accept="application/json,.json" @change="importFile($event)" :disabled="busy">
      </div>
      <p>{{ t('x_dataset.split_help') }}</p>
      <p x-show="error" role="alert" translate="no" :dir="/\p{Script=Arabic}/u.test(error) ? 'rtl' : 'ltr'" x-text="error"></p>
      <p x-show="notice" role="status" aria-live="polite" x-text="notice"></p>
    </div>
    <div class="xd-layout">
      <aside class="xs-card"><h3>{{ t('x_dataset.collections') }}</h3>
        <button class="btn btn-secondary btn-sm" @click="load()" :disabled="busy">{{ t('common.refresh') }}</button>
        <p x-show="loading" role="status">{{ t('common.loading') }}</p>
        <p x-show="!loading && !error && !rows.length">{{ t('x_dataset.empty') }}</p>
        <template x-for="row in rows" :key="row.id"><button class="xd-collection" @click="open(row.id)" :disabled="busy" :aria-pressed="selectedId === row.id">
          <strong translate="no" x-text="row.name"></strong><span x-text="t(row.purpose)"></span>
          <span x-text="row.reviewed + ' / ' + row.cases"></span>
        </button></template>
      </aside>
      <div class="xs-card" style="min-width:0;">
        <template x-if="dataset"><div>
          <h3 translate="no" x-text="dataset.name"></h3><p x-text="t(dataset.purpose)"></p>
          <div class="xd-metrics"><span>{{ t('x_dataset.cases') }} <strong x-text="stats.total"></strong></span><span>{{ t('x_dataset.reviewed') }} <strong x-text="stats.reviewed"></strong></span>
            <span>{{ t('x_dataset.groups') }} <strong x-text="stats.groups"></strong></span><span>{{ t('x_dataset.english') }} <strong x-text="stats.en"></strong></span><span>{{ t('x_dataset.arabic') }} <strong x-text="stats.ar"></strong></span></div>
          <div class="xd-actions"><button class="btn btn-secondary" @click="collect()" :disabled="busy">{{ t('x_dataset.collect') }}</button><button class="btn btn-primary" @click="edit()" :disabled="busy">{{ t('x_dataset.add') }}</button>
            <button class="btn btn-secondary" @click="download(false)" :disabled="busy">{{ t('x_dataset.export_cases') }}</button><button class="btn btn-secondary" @click="download(true)" :disabled="busy">{{ t('x_dataset.export_report') }}</button></div>
          <p>{{ t('x_dataset.workflow') }}</p>
          <label for="xd-search">{{ t('common.search') }}</label><input id="xd-search" class="form-input" type="search" x-model="query" autocomplete="off">
          <p x-show="!filtered.length">{{ t('x_dataset.no_cases') }}</p>
          <template x-for="c in visible" :key="c.id"><button class="xd-case" @click="edit(c)" :disabled="busy">
            <strong translate="no" x-text="c.context.author_handle || c.context.source_id || c.id"></strong>
            <span translate="no" :dir="/\p{Script=Arabic}/u.test(c.context.text) ? 'rtl' : 'ltr'" x-text="c.context.text"></span>
            <small x-text="c.human_reviewed ? t('reviewed') : t('unreviewed')"></small>
          </button></template>
          <div class="xd-actions"><button class="btn btn-secondary" @click="page--" :disabled="page === 0 || busy">{{ t('x_dataset.previous') }}</button><span x-text="page + 1"></span>
            <button class="btn btn-secondary" @click="page++" :disabled="(page + 1) * 20 >= filtered.length || busy">{{ t('x_dataset.next') }}</button></div>
        </div></template>
        <template x-if="form"><form @submit.prevent="save()" @invalid.capture.prevent="invalidField($event)" class="xd-editor">
          <h3>{{ t('x_dataset.edit') }}</h3>
          <p>{{ t('x_dataset.partial_help') }}</p>
          <fieldset :disabled="busy" style="border:0;padding:0;min-width:0;">
            <label for="xd-source-text">{{ t('x_dataset.original') }}</label><textarea id="xd-source-text" name="source_text" class="form-input" x-model="form.case.context.text" rows="5" maxlength="32000" :dir="/\p{Script=Arabic}/u.test(form.case.context.text) ? 'rtl' : 'ltr'"></textarea>
            <div class="xd-grid">
              <div><label for="xd-source-id">{{ t('x_dataset.source_id') }}</label><input id="xd-source-id" class="form-input" x-model="form.case.context.source_id" autocomplete="off" spellcheck="false" maxlength="100"></div>
              <div><label for="xd-author">{{ t('x_dataset.author') }}</label><input id="xd-author" class="form-input" x-model="form.case.context.author_handle" autocomplete="off" spellcheck="false" maxlength="100"></div>
              <div><label for="xd-summon-id">{{ t('x_dataset.summon_id') }}</label><input id="xd-summon-id" class="form-input" x-model="form.case.summon.id" autocomplete="off" maxlength="300"></div>
              <div><label for="xd-summoner">{{ t('x_dataset.summoner') }}</label><input id="xd-summoner" class="form-input" x-model="form.case.summon.author" autocomplete="off" maxlength="300"></div>
              <div><label for="xd-conversation">{{ t('x_dataset.conversation') }}</label><input id="xd-conversation" class="form-input" x-model="form.case.summon.conversation_id" autocomplete="off" maxlength="300"></div>
              <div><label for="xd-followers">{{ t('x_dataset.followers') }}</label><input id="xd-followers" type="number" min="0" class="form-input" x-model="form.followers"></div>
            </div>
            <label for="xd-summon-text">{{ t('x_dataset.summon_text') }}</label><textarea id="xd-summon-text" class="form-input" x-model="form.case.summon.text" rows="2" maxlength="32000"></textarea>
            <details><summary>{{ t('x_dataset.completeness') }}</summary>
              <label class="xd-check"><input type="checkbox" x-model="form.case.context.verified_source">{{ t('x_dataset.source_verified') }}</label>
              <label class="xd-check"><input type="checkbox" x-model="form.case.context.author_resolved">{{ t('x_dataset.author_verified') }}</label>
              <label class="xd-check"><input type="checkbox" x-model="form.case.context.truncated">{{ t('x_dataset.truncated') }}</label>
              <label class="xd-check"><input type="checkbox" x-model="form.case.context.fallback_text">{{ t('x_dataset.excerpt') }}</label>
              <label class="xd-check"><input type="checkbox" x-model="form.case.context.missing_quote">{{ t('x_dataset.missing_quote') }}</label>
              <label class="xd-check"><input type="checkbox" x-model="form.case.context.media_present">{{ t('x_dataset.missing_media') }}</label>
              <p>{{ t('x_dataset.context_help') }}</p>
              <template x-for="(quote, index) in form.case.context.quotes" :key="index"><div class="xd-quote">
                <label :for="'xd-quote-id-' + index">{{ t('x_dataset.source_id') }}</label><input :id="'xd-quote-id-' + index" class="form-input" x-model="quote.id" autocomplete="off">
                <label :for="'xd-quote-author-' + index">{{ t('x_dataset.quoted_author') }}</label><input :id="'xd-quote-author-' + index" class="form-input" x-model="quote.author_id" autocomplete="off">
                <label :for="'xd-quote-text-' + index">{{ t('x_dataset.quote_text') }}</label><textarea :id="'xd-quote-text-' + index" class="form-input" x-model="quote.text" maxlength="32000"></textarea>
              </div></template>
              <button class="btn btn-secondary btn-sm" type="button" @click="form.case.context.quotes.push({id:'',author_id:'',text:''})" :disabled="form.case.context.quotes.length >= 10">{{ t('x_dataset.add_quote') }}</button>
            </details>
            <div class="xd-grid">
              <div><label for="xd-language">{{ t('x_dataset.language') }} <span class="xd-required">{{ t('x_dataset.required_review') }}</span></label><select id="xd-language" class="form-input" x-model="form.case.language" :aria-required="reviewed"><option value="">{{ t('x_dataset.unlabeled') }}</option><option value="en">{{ t('x_dataset.english') }}</option><option value="ar">{{ t('x_dataset.arabic') }}</option><option value="mixed">{{ t('x_dataset.mixed') }}</option></select></div>
              <div><label for="xd-fault">{{ t('x_dataset.fault') }}</label><select id="xd-fault" class="form-input" x-model="form.case.fault"><option value="">{{ t('x_dataset.no_fault') }}</option><option value="checker_outage">{{ t('x_dataset.checker_outage') }}</option></select></div>
            </div>
            <fieldset class="xd-categories"><legend>{{ t('x_dataset.categories') }} <span class="xd-required">{{ t('x_dataset.required_review') }}</span></legend><template x-for="category in categories" :key="category"><label class="xd-check"><input type="checkbox" :value="category" x-model="form.case.categories"><span x-text="t('category_' + category)"></span></label></template></fieldset>
            <label class="xd-check"><input type="checkbox" x-model="form.targetLabeled">{{ t('x_dataset.target_labeled') }} <span class="xd-required">{{ t('x_dataset.required_review') }}</span></label>
            <label for="xd-target">{{ t('x_dataset.target') }}</label><input id="xd-target" class="form-input" x-model="form.target" :disabled="!form.targetLabeled" autocomplete="off" maxlength="200">
            <div class="xd-grid"><template x-for="label in ['auto','evidence','safety']" :key="label"><div><label :for="'xd-' + label" ><span x-text="t('expected_' + label)"></span> <span class="xd-required">{{ t('x_dataset.required_review') }}</span></label><select :id="'xd-' + label" class="form-input" x-model="form[label]" :aria-required="reviewed"><option value="">{{ t('x_dataset.unlabeled') }}</option><option value="true">{{ t('x_dataset.yes') }}</option><option value="false">{{ t('x_dataset.no') }}</option></select></div></template></div>
            <label for="xd-rationale">{{ t('x_dataset.rationale') }} <span class="xd-required">{{ t('x_dataset.required_review') }}</span></label><textarea id="xd-rationale" class="form-input" x-model="form.case.rationale" rows="3" maxlength="4000" :aria-required="reviewed"></textarea>
            <label for="xd-notes">{{ t('x_dataset.notes') }}</label><textarea id="xd-notes" class="form-input" x-model="form.case.review_notes" rows="2" maxlength="4000"></textarea>
            <label class="xd-check"><input type="checkbox" x-model="form.case.held_out" :disabled="dataset.purpose !== 'release'">{{ t('x_dataset.held_out') }}</label>
            <div class="xd-observation" x-show="form.case.actual">
              <h4>{{ t('x_dataset.outcome') }}</h4><p>{{ t('x_dataset.outcome_help') }}</p><p translate="no" x-text="form.case.candidate || form.case.observed_candidate || ''"></p>
              <pre translate="no" x-text="JSON.stringify(form.case.actual, null, 2)"></pre>
              <label for="xd-critical">{{ t('x_dataset.critical') }} <span class="xd-required">{{ t('x_dataset.required_review') }}</span></label><input id="xd-critical" type="number" min="0" max="1000" class="form-input" x-model="critical" :aria-required="reviewed && !!form.case.actual">
            </div>
            <label class="xd-check"><input id="xd-reviewed" type="checkbox" x-model="reviewed">{{ t('x_dataset.attestation') }}</label>
            <p>{{ t('x_dataset.review_help') }}</p>
            <p x-show="error" x-cloak x-ref="saveError" tabindex="-1" role="alert" translate="no" dir="auto" x-text="error"></p>
            <div class="xd-actions"><button type="submit" class="btn btn-primary">{{ t('x_dataset.save_case') }}</button><button type="button" class="btn btn-secondary" x-show="reviewed" x-cloak @click="save(false)">{{ t('x_dataset.save_partial') }}</button><span x-show="dirty">{{ t('x_dataset.unsaved') }}</span></div>
          </fieldset>
        </form></template>
      </div>
    </div>
  </section>
</div>
