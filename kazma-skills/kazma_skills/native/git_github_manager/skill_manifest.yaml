name: git-github-manager
version: 0.1.0
description: Manage local git repositories and integrate with GitHub APIs
author: Kazma Team
license: MIT

tools:
  git_status:
    arabic_name: "حالة جيت"
    description: "Get the current git repository status, branch, and staged/unstaged changes."
    category: "git"
    prompt_chain:
      - "احصل على حالة المستودع الحالي"
      - "اعرض التغييرات في صيغة واضحة ومرتبة"
  git_commit:
    arabic_name: "تأكيد التغييرات"
    description: "Commit modified or untracked files with a detailed commit message."
    category: "git"
    prompt_chain:
      - "أضف الملفات المعدلة"
      - "قم بتأكيد التغييرات مع رسالة مناسبة بالعربية أو الإنجليزية"
  git_push:
    arabic_name: "دفع التغييرات"
    description: "Push (upload) local commits to the remote repository on GitHub. Use this to publish local commits."
    category: "git"
    prompt_chain:
      - "ادفع التغييرات المحلية إلى المستودع البعيد على GitHub"
  git_pull:
    arabic_name: "سحب التغييرات"
    description: "Pull (fetch and merge) the latest changes FROM the remote GitHub repository into the local branch. Does NOT push anything."
    category: "git"
    prompt_chain:
      - "اسحب آخر التغييرات من المستودع البعيد إلى الفرع المحلي"
  git_checkout:
    arabic_name: "تبديل الفرع"
    description: "Switch branches or create a new branch locally."
    category: "git"
  git_merge:
    arabic_name: "دمج الفروع"
    description: "Merge a branch into the currently active local branch."
    category: "git"
  github_create_pr:
    arabic_name: "إنشاء طلب سحب"
    description: "Create a new Pull Request on the GitHub repository using GitHub APIs."
    category: "git"
    prompt_chain:
      - "أنشئ طلب سحب جديد في جيت هاب"
  github_merge_pr:
    arabic_name: "دمج طلب السحب"
    description: "Merge an open Pull Request on GitHub using GitHub APIs."
    category: "git"
  github_create_issue:
    arabic_name: "إنشاء مشكلة جيت هاب"
    description: "Create a new Issue on the remote GitHub repository."
    category: "git"
  github_comment_issue:
    arabic_name: "التعليق على مشكلة"
    description: "Post a comment on a GitHub Issue or Pull Request."
    category: "git"
  github_list_issues:
    arabic_name: "عرض مشاكل جيت هاب"
    description: "Retrieve and view list of issues currently open on the remote repository."
    category: "git"
    prompt_chain:
      - "اعرض قائمة المشاكل المفتوحة لمتابعتها"

