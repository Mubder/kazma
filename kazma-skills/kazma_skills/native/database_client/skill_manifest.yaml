name: database-client
version: 0.1.0
description: Relational database manager with schema extraction and secured read-only SQLite/database query executions
author: Kazma Team
license: MIT

tools:
  inspect_db_schema:
    arabic_name: "فحص مخطط قاعدة البيانات"
    description: "Extract list of tables, column names, data types, primary/foreign keys, and indexes from SQLite databases."
    category: "database"
    prompt_chain:
      - "افحص هيكل ومخطط قاعدة البيانات لعرض الجداول والحقول"
  execute_db_query:
    arabic_name: "تنفيذ استعلام قاعدة البيانات"
    description: >
      READ-ONLY SQL SELECT/WITH against a local SQLite file. Cannot INSERT/UPDATE/DELETE.
      NOT for memory cleanup — use memory_list_beliefs / memory_invalidate / memory_search instead.
      Writes return authorization denied.
    category: "database"
    prompt_chain:
      - "قم بتنفيذ استعلام القراءة (SELECT) من قاعدة البيانات"
  sqlite_query:
    arabic_name: "استعلام إس كيو لايت"
    description: >
      READ-ONLY SELECT against a local SQLite file. SELECT only — no memory cleanup,
      no DELETE/UPDATE. Use memory_* tools for long-term memory maintenance.
    category: "database"
    prompt_chain:
      - "قم بتنفيذ استعلام القراءة (SELECT) من قاعدة بيانات إس كيو لايت المحلية"

