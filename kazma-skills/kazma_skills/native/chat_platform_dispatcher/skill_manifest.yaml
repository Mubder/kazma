name: chat-platform-dispatcher
version: 0.1.0
description: Multi-channel notifications and interactive human-in-the-loop action card dispatchers for Slack, Discord, and Telegram
author: Kazma Team
license: MIT

tools:
  dispatch_notification:
    arabic_name: "إرسال تنبيه للمنصات"
    description: "Send a notification message to a specific recipient or channel on Telegram, Discord, or Slack."
    category: "communication"
    prompt_chain:
      - "أرسل إشعاراً أو تنبيهاً فورياً إلى القناة المحددة"
  send_approval_request:
    arabic_name: "إرسال طلب مراجعة"
    description: "Ask the operator on Telegram, Discord or Slack to review something. A plain question: no approval buttons, approves nothing; the operator answers in the chat. A tool that needs approval asks with its own card: never use this in its place."
    category: "communication"
    prompt_chain:
      - "اسأل المشغّل في المحادثة أن يراجع أمراً؛ الرسالة سؤال ولا توافق على شيء"
  send_message:
    arabic_name: "إرسال رسالة"
    description: "Send a text message to a chat on Telegram, Discord or Slack, named by target_id (for example 'telegram:12345') and backend. Your answer already reaches this conversation: use this only to message another chat the user asked you to."
    category: "communication"
    prompt_chain:
      - "أرسل رسالة نصية إلى محادثة في تيليجرام أو ديسكورد أو سلاك يحددها target_id؛ ردّك يصل إلى هذه المحادثة دون هذه الأداة"

