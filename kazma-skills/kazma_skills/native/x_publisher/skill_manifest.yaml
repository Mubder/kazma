name: x-publisher
version: 0.1.0
description: >
  Post and delete tweets through the official X API v2 using OAuth 1.0a user
  context (the four keys from developer.x.com). Never paste keys in chat —
  store them in Settings → X. HITL is mandatory even in YOLO. Downloads a
  public post's video or photos through the same API. No scrape, like,
  follow, or DM. Bearer tokens cannot post.
author: Kazma Team
license: MIT

tools:
  x_status:
    arabic_name: "حالة إكس"
    description: >
      Read-only X connector status: configured?, handle, remaining Kazma
      caps, and the latest posts. Args: recent (how many posts to list,
      1-50, default 5) and offset (how many of the newest to skip) — this is
      how to read Kazma's post history; its database is not queryable
      directly. posts_total is how many the ledger holds; for every post,
      call again with offset=next_offset until it is null. metrics=true also
      reads each listed post's likes, reposts, replies, quotes, bookmarks and
      impressions from X (one read from the X read budget); a post X did not
      return is in metrics_missing, and metrics_error says why none came
      back -- never report a missing count as zero. Never returns
      secrets. If
      unconfigured, tell the operator to open Settings → X (not chat) and
      paste the four OAuth 1.0a keys with Read + Write app permissions.
    category: social
    prompt_chain:
      - "ما حالة نشر إكس؟"
  x_post:
    arabic_name: "تغريدة"
    description: >
      Post one tweet via official POST /2/tweets (OAuth 1.0a). CONTRACT:
      persist drafts with save_proposal FIRST, then call this ONCE PER ITEM
      with proposal_id=<that item's id> — the commitment gate refuses
      without it and rewrites text from the stored proposal (the id wins).
      HITL is ALWAYS required — YOLO and standing grants cannot skip it.
      Policy denies empty text, over-length, duplicate 30d, too many
      @mentions / $cashtags / hashtags, and over Kazma daily/monthly caps.
      Args: text (required), proposal_id (required — the saved proposal
      item id), reply_to_id (optional, for a thread reply). All approval
      cards surface immediately on every path — never advise the operator
      to batch or wait between posts. Never ask the operator to paste API
      secrets in chat. Do not use browser/computer_use to tweet — that
      violates X ToU.
    category: social
    prompt_chain:
      - "انشر تغريدة بعد موافقتي"
  x_delete_post:
    arabic_name: "حذف تغريدة"
    description: >
      Delete a tweet the connector posted (DELETE /2/tweets/:id). HITL
      always required. Args: tweet_id.
    category: social
    prompt_chain:
      - "احذف التغريدة (يتطلب موافقة)"
  x_schedule_post:
    arabic_name: "جدولة تغريدة"
    description: >
      Schedule a tweet to be posted automatically at a future time. CONTRACT:
      persist drafts with save_proposal FIRST, then call this ONCE PER ITEM
      with proposal_id=<that item's id> — the commitment gate refuses without
      it and rewrites text from the stored proposal. HITL is ALWAYS required
      at booking — the operator approves the exact draft and time once. Kazma
      stores it and publishes it at the appointed time (X has no native post
      scheduling). Daily/monthly caps and the 30-day duplicate rule are
      enforced at booking. Args: text (required), when (required, once —
      '30m', '2h', or a date and time read in the operator's zone; an X post
      does not repeat), proposal_id (required — the saved proposal item id),
      reply_to_id (optional). Rebooking a draft already booked at another
      time is a conflict. The post fires only while the Kazma server is
      running.
    category: social
    prompt_chain:
      - "جدول تغريدة لتنشر لاحقًا بعد موافقتي"
  x_download_media:
    arabic_name: "تنزيل وسائط إكس"
    description: >
      Download the video, GIF or photos attached to a public X post, through
      the official X API (one read from the X read budget) -- no browser,
      shell or yt-dlp needed. Args: post (the x.com / twitter.com link, or
      the post id). Saves each file in the workspace's downloads/x folder (a
      video at the highest quality under 50 MB, the most a chat can be sent)
      and answers with the paths; then send each to the user with
      send_file(file_path=<path>). A post with no media, or files X would
      not serve, is said in the answer.
    category: social
    prompt_chain:
      - "نزّل الفيديو من هالتغريدة وأرسله لي"
  x_draft_posts:
    arabic_name: "صياغة منشورات إكس"
    description: >
      Write X posts the way X Studio's Generate does, and save them to X
      Studio's drafts for the user to review: the X model writes 1-3
      alternatives from the brief and the operator's reference documents
      (Settings -> X; for posts about Kazma, the page describing Kazma), and
      each is fact-checked against them. Use this whenever the user asks for
      X posts or tweets to be written; use save_proposal only for text the
      user gave word for word. Args: brief (what the post is about, 1-4000
      characters; put any facts the user gave in it) and count (1-3,
      default 1). Answers with each draft's id, text, X length and check
      verdicts. Show the drafts and stop: a draft is never published in the
      turn that wrote it.
    category: social
    prompt_chain:
      - "اكتب لي تغريدتين عن كاظمه"
  x_list_scheduled:
    arabic_name: "عرض التغريدات المجدولة"
    description: >
      List scheduled X posts with their status (managed -- booked and waiting
      to publish --, held for review, sending, outcome_unknown, fired,
      cancelled, failed, expired), text and fire time, plus each booking's
      publication operation and its state. Read-only. Saved drafts that were
      never posted or booked are read with list_proposals.
    category: social
    prompt_chain:
      - "اعرض التغريدات المجدولة"
  x_cancel_scheduled_post:
    arabic_name: "إلغاء تغريدة مجدولة"
    description: >
      Cancel a scheduled X post before it fires (releases its reserved quota).
      HITL always required. Args: post_id (the scheduled post id).
    category: social
    prompt_chain:
      - "ألغِ التغريدة المجدولة (يتطلب موافقة)"
