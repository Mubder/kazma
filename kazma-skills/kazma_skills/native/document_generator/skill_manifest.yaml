name: document-generator
version: 0.3.0
description: Generate verified PDF, DOCX, XLSX, and Markdown artifacts in isolated workers.
author: Kazma Team
license: MIT

tools:
  generate_pdf:
    arabic_name: "إنشاء PDF"
    description: >
      Generate a styled PDF (headings, bullets, bold/italic, justified body).
      LARGE DOCUMENTS (>5 sections or >2000 words): first write the content
      to a .md file via file_write (chunked), then pass markdown_path="file.md"
      — inline sections that exceed the model's output token limit get
      truncated into unparseable JSON. Small docs: inline sections with
      markdown bodies (# ##, - lists, **bold**). Arabic is auto-shaped
      (reshape+bidi); pass lang=ar or rtl=true if needed.
    category: document
    prompt_chain:
      - "أنشئ مستند PDF منسّق (عناوين، نقاط، تبرير) مع أقسام body بصيغة markdown"
      - "للمستندات الكبيرة: اكتب المحتوى في ملف .md أولاً ثم استخدم markdown_path"
      - "للعربية استخدم lang=ar — الحروف تُشكَّل وترتيب bidi تلقائياً"
      - "احفظ الملف وأعد المسار"
  generate_docx:
    arabic_name: "إنشاء DOCX"
    description: >
      Generate a styled Word document with Heading styles, bullet/number lists,
      justified paragraphs, and RTL (w:bidi) when Arabic is detected.
      LARGE DOCUMENTS: write content to a .md file first, then pass
      markdown_path="file.md" (same as generate_pdf). Small docs: inline
      sections with markdown bodies.
    category: document
    prompt_chain:
      - "أنشئ مستند Word منسّق (أنماط عناوين، قوائم، تبرير، RTL للعربية)"
      - "للمستندات الكبيرة استخدم markdown_path بعد كتابة الملف"
  generate_xlsx:
    arabic_name: "إنشاء XLSX"
    description: >
      Generate and round-trip validate an Excel workbook in an isolated renderer.
      Live readiness requires openpyxl.
    category: document
    prompt_chain:
      - "أنشئ ملف Excel من الأوراق والصفوف المحددة"
  generate_markdown_doc:
    arabic_name: "إنشاء ملف Markdown"
    description: >
      Generate an atomic UTF-8 Markdown artifact with Unicode preservation.
    category: document
    prompt_chain:
      - "أنشئ ملف Markdown من العنوان والأقسام"
