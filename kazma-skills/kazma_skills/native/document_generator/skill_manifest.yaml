name: document-generator
version: 0.2.0
description: Generate verified PDF, DOCX, XLSX, and Markdown artifacts in isolated workers.
author: Kazma Team
license: MIT

tools:
  generate_pdf:
    arabic_name: "إنشاء PDF"
    description: >
      Generate a styled PDF (headings, bullets, bold/italic, justified body).
      Put real markdown in each section body (# ##, - lists, **bold**).
      Arabic is auto-shaped (reshape+bidi); pass lang=ar or rtl=true if needed.
      Requires reportlab + arabic-reshaper + python-bidi for correct Arabic.
    category: document
    prompt_chain:
      - "أنشئ مستند PDF منسّق (عناوين، نقاط، تبرير) مع أقسام body بصيغة markdown"
      - "للعربية استخدم lang=ar — الحروف تُشكَّل وترتيب bidi تلقائياً"
      - "احفظ الملف وأعد المسار"
  generate_docx:
    arabic_name: "إنشاء DOCX"
    description: >
      Generate a styled Word document with Heading styles, bullet/number lists,
      justified paragraphs, and RTL (w:bidi) when Arabic is detected.
      Use markdown in section bodies the same way as generate_pdf.
    category: document
    prompt_chain:
      - "أنشئ مستند Word منسّق (أنماط عناوين، قوائم، تبرير، RTL للعربية)"
  generate_xlsx:
    arabic_name: "إنشاء XLSX"
    description: >
      Generate and round-trip validate an Excel workbook in an isolated renderer.
      Live readiness requires openpyxl.
    category: document
    prompt_chain:
      - "أنشئ ملف Excel من الأوراق والصفوف المحددة"
  generate_markdown_doc:
    arabic_name: "إنشاء ملف Markdown"
    description: >
      Generate an atomic UTF-8 Markdown artifact with Unicode preservation.
    category: document
    prompt_chain:
      - "أنشئ ملف Markdown من العنوان والأقسام"
