name: document-generator
version: 0.2.0
description: Generate verified PDF, DOCX, XLSX, and Markdown artifacts in isolated workers.
author: Kazma Team
license: MIT

tools:
  generate_pdf:
    arabic_name: "إنشاء PDF"
    description: >
      Generate and round-trip validate a PDF artifact in an isolated renderer.
      Live readiness requires reportlab and reports Unicode font fallback warnings.
    category: document
    prompt_chain:
      - "أنشئ مستند PDF من العنوان والأقسام المحددة"
      - "احفظ الملف وأعد المسار"
  generate_docx:
    arabic_name: "إنشاء DOCX"
    description: >
      Generate and round-trip validate a Word document in an isolated renderer.
      Live readiness requires python-docx.
    category: document
    prompt_chain:
      - "أنشئ مستند Word من العنوان والأقسام المحددة"
  generate_xlsx:
    arabic_name: "إنشاء XLSX"
    description: >
      Generate and round-trip validate an Excel workbook in an isolated renderer.
      Live readiness requires openpyxl.
    category: document
    prompt_chain:
      - "أنشئ ملف Excel من الأوراق والصفوف المحددة"
  generate_markdown_doc:
    arabic_name: "إنشاء ملف Markdown"
    description: >
      Generate an atomic UTF-8 Markdown artifact with Unicode preservation.
    category: document
    prompt_chain:
      - "أنشئ ملف Markdown من العنوان والأقسام"
