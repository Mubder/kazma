name: document-platform
version: 0.1.0
description: >
  PREFERRED document surface. Durable ingestion, status, paged read, indexing,
  conversion, redaction and search via the shared DocumentIngestionService —
  opaque IDs, tenant ACL, versioning, audit and restart-safe jobs. Use this
  whenever a document should outlive the current turn. The path-based tools in
  document-processor are for one-off reads of a workspace file.
author: Kazma Team
license: MIT

tools:
  document_import:
    arabic_name: "استيراد مستند"
    description: >
      Ingest a workspace-safe local file into the durable document platform
      (quarantine, validate, parse out-of-process) and return its opaque
      document_id/job_id. Waits up to 30 seconds: the state is final if
      processing finished by then, otherwise the reply says it is still
      processing (follow it with document_status). Only files inside the active
      workspace are accepted; arbitrary server paths are refused. The way to
      read a long scanned document: it is OCR'd in the background a few pages
      at a time with no per-call time limit (about 15-45 s a page), and
      document_status shows how many pages are read; document_read then reads
      its text.
    category: document
    prompt_chain:
      - "استورد المستند المحدد إلى منصة المستندات"
  document_status:
    arabic_name: "حالة المستند"
    description: >
      With no ids: tenant document-platform overview (enabled, workers,
      queue, catalog count, recent titles). With document_id or job_id:
      that job's stage, attempt count, OCR pages read so far for a scan, and
      any safe error diagnostics.
    category: document
    prompt_chain:
      - "اعرض حالة معالجة المستند"
  document_read:
    arabic_name: "قراءة مستند معالَج"
    description: >
      Read paged, fenced content of an already-processed document by its
      opaque document_id, with page/offset/max_chars selectors and
      deterministic continuation.
    category: document
    prompt_chain:
      - "اقرأ محتوى المستند المعالَج"
  document_index:
    arabic_name: "فهرسة مستند"
    description: >
      Publish a processed document's current immutable version into a
      Knowledge library for retrieval and citation.
    category: document
    prompt_chain:
      - "افهرس المستند في مكتبة المعرفة"
  document_search:
    arabic_name: "بحث في المستندات"
    description: >
      Search a Knowledge library and return matching document chunks inside
      exactly one untrusted-data fence with page/version citations.
    category: document
    prompt_chain:
      - "ابحث في المستندات المفهرسة"
  document_cancel:
    arabic_name: "إلغاء مهمة مستند"
    description: >
      Request cooperative cancellation of a running or pending document
      processing job by its opaque job_id.
    category: document
    prompt_chain:
      - "ألغِ مهمة معالجة المستند"
  document_convert:
    arabic_name: "تحويل مستند"
    description: >
      Convert an already-processed document (by opaque document_id) to another
      format through the isolated renderer. Only the immutable original bytes
      are used; no raw file path is accepted. Saves the new file under the
      data folder's documents and returns its path -- give it to the user
      with send_file -- and its artifact_id. HTML to PDF comes out in Kazma's
      house style.
    category: document
    prompt_chain:
      - "حوّل المستند المعالَج إلى صيغة أخرى"
  document_redact:
    arabic_name: "تنقيح مستند"
    description: >
      Physically redact a list of terms from a processed PDF document by opaque
      document_id, creating a new independently-verified immutable artifact,
      saved under the data folder's documents (the path is returned, for
      send_file). Terms are never logged; mixed image/vector PDFs fail closed.
    category: document
    prompt_chain:
      - "نقّح المصطلحات المحددة من المستند"
