# MCP server presets for the /mcp page's "Add Server" list.
#
# Every entry runs a package that exists and is maintained, published by the
# Model Context Protocol project or by the vendor of the service it connects
# to. `package` names it on its registry (npm for `npx -y`, PyPI for `uvx`);
# `tests/fixtures/mcp_catalog_registry.json` records, from the registries,
# that each one exists, is not deprecated, and who publishes it, and
# `tests/test_mcp_catalog.py` fails for a preset missing from that record.
# Refresh the record with `python scripts/verify_mcp_catalog.py --write`.
#
# Until 2026-09-30 this file listed 81 "certified" servers "last verified
# 2026-06-20"; 78 named packages no registry has ever held
# (`@anthropic-ai/*-mcp`, `@modelcontextprotocol/server-git`, ...), so
# adding one failed its connection test, and the SQLite entry pointed a
# server at Kazma's own database.
#
# Left out on purpose:
#   fetch        a raw URL fetcher bypasses Kazma's egress guard; the agent's
#                own read_url validates every address (AGENTS.md §32).
#   github       Kazma's own GitHub tools; the official server ships as a
#                Docker image.
#   postgres, sqlite, redis, slack, gdrive, google-maps, puppeteer and the
#                old brave-search: deprecated on npm or archived upstream.
#
# `env` lists the variables a server needs, with empty values the operator
# fills in; a key is kept in Kazma's vault, never in this file or kazma.yaml.
# `${KAZMA_ACTIVE_WORKSPACE}` in a command follows the active workspace.
#
# Supported transports in kazma.yaml mcp.servers config:
#   stdio            — spawn a local subprocess (command required). Used by all
#                      entries below.
#   sse              — connect to a remote SSE endpoint (url required).
#   streamable_http  — connect to a remote Streamable HTTP endpoint (url
#                      required, MCP 2025-03-26 spec).

servers:
  filesystem:
    name: "Filesystem"
    description: "Read, search and write files in the active workspace"
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "${KAZMA_ACTIVE_WORKSPACE}"]
    package: {registry: npm, name: "@modelcontextprotocol/server-filesystem"}
    source: "https://github.com/modelcontextprotocol/servers"
    transport: stdio
    workspace_bound: true
    category: filesystem

  git:
    name: "Git"
    description: "Status, diff, log, branches and commits in the active workspace's repository"
    command: ["uvx", "mcp-server-git", "--repository", "${KAZMA_ACTIVE_WORKSPACE}"]
    package: {registry: pypi, name: "mcp-server-git"}
    source: "https://github.com/modelcontextprotocol/servers"
    transport: stdio
    workspace_bound: true
    category: code

  time:
    name: "Time"
    description: "Current time and time zone conversion"
    command: ["uvx", "mcp-server-time"]
    package: {registry: pypi, name: "mcp-server-time"}
    source: "https://github.com/modelcontextprotocol/servers"
    transport: stdio
    category: productivity

  memory:
    name: "Memory (knowledge graph)"
    description: "A knowledge graph the server keeps in its own file, apart from Kazma's memory"
    command: ["npx", "-y", "@modelcontextprotocol/server-memory"]
    package: {registry: npm, name: "@modelcontextprotocol/server-memory"}
    source: "https://github.com/modelcontextprotocol/servers"
    transport: stdio
    category: data

  sequential_thinking:
    name: "Sequential Thinking"
    description: "Step-by-step problem solving through a sequence of thoughts"
    command: ["npx", "-y", "@modelcontextprotocol/server-sequential-thinking"]
    package: {registry: npm, name: "@modelcontextprotocol/server-sequential-thinking"}
    source: "https://github.com/modelcontextprotocol/servers"
    transport: stdio
    category: ai

  playwright:
    name: "Playwright (browser automation)"
    description: "Navigate, click, fill forms and take screenshots in a browser"
    command: ["npx", "-y", "@playwright/mcp@latest"]
    package: {registry: npm, name: "@playwright/mcp"}
    source: "https://github.com/microsoft/playwright-mcp"
    transport: stdio
    category: web

  firecrawl:
    name: "Firecrawl (web scraping)"
    description: "Scrape, crawl and map websites through Firecrawl"
    command: ["npx", "-y", "firecrawl-mcp"]
    package: {registry: npm, name: "firecrawl-mcp"}
    source: "https://github.com/firecrawl/firecrawl-mcp-server"
    transport: stdio
    category: web
    env: {FIRECRAWL_API_KEY: ""}

  brave_search:
    name: "Brave Search"
    description: "Web, news, image and local search through the Brave Search API"
    command: ["npx", "-y", "@brave/brave-search-mcp-server"]
    package: {registry: npm, name: "@brave/brave-search-mcp-server"}
    source: "https://github.com/brave/brave-search-mcp-server"
    transport: stdio
    category: web
    env: {BRAVE_API_KEY: ""}

  context7:
    name: "Context7 (library docs)"
    description: "Current documentation and code examples for libraries (an API key is optional: CONTEXT7_API_KEY)"
    command: ["npx", "-y", "@upstash/context7-mcp"]
    package: {registry: npm, name: "@upstash/context7-mcp"}
    source: "https://github.com/upstash/context7"
    transport: stdio
    category: code

  notion:
    name: "Notion"
    description: "Search, read and edit Notion pages and databases"
    command: ["npx", "-y", "@notionhq/notion-mcp-server"]
    package: {registry: npm, name: "@notionhq/notion-mcp-server"}
    source: "https://github.com/makenotion/notion-mcp-server"
    transport: stdio
    category: productivity
    env: {NOTION_TOKEN: ""}

  stripe:
    name: "Stripe"
    description: "Customers, products, payments and refunds in a Stripe account"
    command: ["npx", "-y", "@stripe/mcp"]
    package: {registry: npm, name: "@stripe/mcp"}
    source: "https://github.com/stripe/ai"
    transport: stdio
    category: finance
    env: {STRIPE_SECRET_KEY: ""}

  heroku:
    name: "Heroku"
    description: "Apps, dynos, add-ons and logs on Heroku"
    command: ["npx", "-y", "@heroku/mcp-server"]
    package: {registry: npm, name: "@heroku/mcp-server"}
    source: "https://github.com/heroku/heroku-mcp-server"
    transport: stdio
    category: devops
    env: {HEROKU_API_KEY: ""}

  aws_documentation:
    name: "AWS Documentation"
    description: "Search and read the AWS documentation"
    command: ["uvx", "awslabs.aws-documentation-mcp-server@latest"]
    package: {registry: pypi, name: "awslabs.aws-documentation-mcp-server"}
    source: "https://github.com/awslabs/mcp"
    transport: stdio
    category: devops
