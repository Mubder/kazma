# Kazma Docker Compose
#
# Container listens on 8000 (Dockerfile EXPOSE). Host default CLI port is 9090.
# Map host 9090 → container 8000 so local bookmarks match `kazma serve`.
# Override: HOST_PORT=8000 docker compose up
#
# Production checklist (set in .env):
#   KAZMA_SECRET=<strong random>
#   KAZMA_VAULT_KEY=<fernet key>
#   KAZMA_PRODUCTION=1
#   KAZMA_CODE_EXEC_DOCKER=force
#   KAZMA_TRUST_LAN=0
services:
  kazma:
    build: .
    container_name: kazma
    ports:
      - "${HOST_PORT:-9090}:8000"
    volumes:
      - kazma_data:/app/kazma-data
      # Match Dockerfile USER kazma home (not /root/...)
      - kazma_vectors:/home/kazma/.kazma/vector_memory
    env_file:
      - .env
    environment:
      # Required inside Docker so published ports reach the process.
      # Security boundary: strong KAZMA_SECRET + reverse proxy TLS, not bind alone.
      KAZMA_HOST: "0.0.0.0"
      KAZMA_TRUST_LAN: "${KAZMA_TRUST_LAN:-0}"
      KAZMA_PRODUCTION: "${KAZMA_PRODUCTION:-1}"
      KAZMA_CODE_EXEC_DOCKER: "${KAZMA_CODE_EXEC_DOCKER:-force}"
      KAZMA_VECTOR_PATH: "/home/kazma/.kazma/vector_memory"
      # When running with profile `search`, point at the compose service DNS name.
      # Host-local Kazma should use http://127.0.0.1:8088 instead.
      KAZMA_SEARXNG_URL: "${KAZMA_SEARXNG_URL:-http://searxng:8080}"
    restart: unless-stopped
    healthcheck:
      # /health is always open; /api/gateway/status requires auth when secret set
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional privacy-friendly meta-search (enables reliable web_search).
  # Start: docker compose --profile search up -d searxng
  # Point host Kazma at: KAZMA_SEARXNG_URL=http://127.0.0.1:8088
  searxng:
    profiles: ["search"]
    image: docker.io/searxng/searxng:latest
    container_name: kazma-searxng
    ports:
      - "${SEARXNG_HOST_PORT:-8088}:8080"
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://127.0.0.1:8088/}"
    restart: unless-stopped
    # JSON API is required by kazma_core.tools.web_search — enabled in
    # deploy/searxng/settings.yml (search.formats includes json).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kazma_data:
    driver: local
  kazma_vectors:
    driver: local
