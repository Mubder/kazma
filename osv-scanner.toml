# Advisories on packages in uv.lock that have no fixed release and that
# Kazma's use of the package cannot reach, read for OSV-Scanner (which OpenSSF
# Scorecard's Vulnerabilities check runs). The one review is
# kazma_core.security.dependency_scanner.REVIEWED_ADVISORIES: its reason and
# what code would make the advisory reachable (tests/test_dependency_scanner.py
# fails when that code appears). Each advisory is listed under its PyPI id and
# its GitHub id; tests/test_osv_scanner_ignores.py holds this file to that
# list, both ways. Remove an entry when its package is updated past it.

