# Fly.io configuration for Kazma live demo
# Deploy: fly deploy (from this branch after merge)
# App: https://kazma-demo.fly.dev (or your fly app URL)

app = "kazma-demo"
primary_region = "fra"  # Frankfurt — good latency for KW/EU

[build]
  dockerfile = "Dockerfile.demo"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true   # stop when idle (saves free tier hours)
  auto_start_machines = true  # wake on first request
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  hard_limit = 20
  soft_limit = 10

[[vm]]
  size = "shared-cpu-1x"   # free tier (256MB RAM)
  memory = 256

# Secrets — set once (never commit real keys):
#   fly secrets set KAZMA_SECRET=<random> GROQ_API_KEY=<key> KAZMA_DEMO_MODE=true
#
# Optional overrides (demo defaults when KAZMA_DEMO_MODE=true):
#   KAZMA_PROVIDER=groq
#   KAZMA_MODEL=groq/compound-mini
#
# Demo locks provider to Groq with presets:
#   groq/compound-mini (default), llama-3.3-70b-versatile, llama-3.1-8b-instant
