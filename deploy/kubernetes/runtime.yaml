# Preparation template: substitute the image digest and fenced CSI class,
# create kazma-runtime-secrets, then perform the deployment guide's drills.
#
# The root filesystem is read-only (2026-11-11). Every place Kazma writes is a
# mount: /state (the volume: data, home, skills, vectors, the env file a
# generated key is kept in, the Hugging Face model cache), and emptyDirs for
# the temp folder (/tmp: scratch, LibreOffice profiles, a shell tool's home),
# the user's home (/home/kazma: caches under ~/.cache and ~/.config) and
# ClamAV's signatures, log and run folders (freshclam refreshes them; the
# signatures the image was built with are copied in first).
# tests/test_kubernetes_runtime_contract.py resolves Kazma's own write
# locations under this environment and fails on one outside every mount.
apiVersion: v1
kind: Service
metadata:
  name: kazma
spec:
  selector:
    app: kazma
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: kazma-headless
spec:
  clusterIP: None
  selector:
    app: kazma
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kazma
spec:
  serviceName: kazma-headless
  replicas: 1
  selector:
    matchLabels:
      app: kazma
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kazma
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The ClamAV signatures the image was built with, into the writable
        # folder freshclam refreshes (an emptyDir hides the image's copy).
        - name: clamav-signatures
          image: ghcr.io/mubder/kazma:REPLACE_WITH_RELEASE
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /var/lib/clamav/. /seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: clamav-db
              mountPath: /seed
      containers:
        - name: kazma
          image: ghcr.io/mubder/kazma:REPLACE_WITH_RELEASE
          imagePullPolicy: IfNotPresent
          args:
            - python
            - -m
            - uvicorn
            - kazma_ui.app:create_app
            - --factory
            - --no-proxy-headers
            - --no-server-header
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --timeout-graceful-shutdown
            - "135"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KAZMA_RUNTIME_HA
              value: "1"
            - name: KAZMA_DB_BACKEND
              value: postgres
            - name: KAZMA_PRODUCTION
              value: "1"
            - name: KAZMA_HOST_SHELL
              value: "0"
            - name: KAZMA_AUTO_MIGRATE
              value: "0"
            - name: KAZMA_DATA_DIR
              value: /state/data
            - name: KAZMA_USER_HOME
              value: /state/home
            - name: KAZMA_SKILLS_HOME
              value: /state/skills
            - name: KAZMA_VECTOR_PATH
              value: /state/vector_memory
            # A key the server generates (none, while the secrets below are
            # set) is kept on the volume, not in the read-only /app.
            - name: KAZMA_ENV_FILE
              value: /state/home/.env
            # The meaning-search model (about 4 GB) is kept on the volume:
            # in the home's emptyDir it would download again at every start.
            - name: HF_HOME
              value: /state/cache/huggingface
            - name: HOME
              value: /home/kazma
            - name: TMPDIR
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: KAZMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kazma-runtime-secrets
                  key: database-url
            - name: KAZMA_SECRET
              valueFrom:
                secretKeyRef:
                  name: kazma-runtime-secrets
                  key: auth-secret
            - name: KAZMA_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: kazma-runtime-secrets
                  key: vault-key
            - name: KAZMA_TRUSTED_PROXIES
              valueFrom:
                secretKeyRef:
                  name: kazma-runtime-secrets
                  key: trusted-proxies
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 2
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/kazma
            - name: clamav-db
              mountPath: /var/lib/clamav
            - name: clamav-log
              mountPath: /var/log/clamav
            - name: clamav-run
              mountPath: /run/clamav
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        - name: home
          emptyDir:
            sizeLimit: 2Gi
        - name: clamav-db
          emptyDir:
            sizeLimit: 2Gi
        - name: clamav-log
          emptyDir:
            sizeLimit: 256Mi
        - name: clamav-run
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOncePod]
        storageClassName: REPLACE_WITH_FENCED_CSI_CLASS
        resources:
          requests:
            storage: 100Gi
