# Neo4j for Kazma's memory graph: a copy of the beliefs SQLite holds (SQLite
# stays the source of truth), dual-written as facts change.
#
# `kazma setup install` starts it on Windows and Linux (Express and Full,
# kazma_core.container_services): it keeps a generated KAZMA_NEO4J_PASSWORD in
# the install's .env, runs
#   docker compose -f deploy/docker-compose.neo4j.yml --env-file .env -p kazma-graph up -d kazma-neo4j
# and points Kazma at it (KAZMA_NEO4J_URL, KAZMA_NEO4J_DEFAULT=1 in .env).
# By hand: set KAZMA_NEO4J_PASSWORD in .env to a long random value, then run
# the line above; or Settings -> Memory -> Graph store = Neo4j, Save, Test, Sync.
#
# Kazma still paints Dashboard topology from SQLite; Neo4j receives dual-writes.

name: kazma-graph

services:
  kazma-neo4j:
    # Pinned by version and digest (2026-11-13): `neo4j:5` ran whatever the
    # registry served at each start. 5.26 is Neo4j's long-term-support line.
    image: neo4j:5.26.32@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    container_name: kazma-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${KAZMA_NEO4J_PASSWORD:?Set KAZMA_NEO4J_PASSWORD to a strong password}
      # Bounded for a computer that also runs Kazma: Neo4j's own default sizes
      # its heap and page cache from the machine's memory.
      NEO4J_server_memory_heap_initial__size: "${KAZMA_NEO4J_HEAP:-512m}"
      NEO4J_server_memory_heap_max__size: "${KAZMA_NEO4J_HEAP:-512m}"
      NEO4J_server_memory_pagecache_size: "${KAZMA_NEO4J_PAGECACHE:-512m}"
      # Neo4j sends anonymous usage data to Neo4j Inc. unless told not to
      # (found 2026-11-13 in the live container's log): nothing of Kazma's
      # leaves the machine unasked.
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - kazma-neo4j-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  kazma-neo4j-data:
