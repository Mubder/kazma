# Single-owner reverse proxy for Kazma's local persistent state.
# Used with: docker compose -f docker-compose.ha.yml up -d

worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream kazma_backend {
    zone kazma_backend 64k;
    server kazma:8000 resolve;
    keepalive 32;
  }

  server {
    listen 80;
    client_max_body_size 50m;

    location /health/live {
      proxy_pass http://kazma_backend;
      proxy_http_version 1.1;
    }

    location /health/ready {
      proxy_pass http://kazma_backend;
      proxy_http_version 1.1;
    }

    location /ws/ {
      proxy_pass http://kazma_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://kazma_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # SSE / long streams
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
